function livingEnemies(){ return ui.battle.enemies.filter(e=>e.hp>0); }

/* Every Very High status now covers the whole field or the whole enemy wave,
   so none of them ask the player to pick a target. Kept as a list because a
   future single-target status would simply be added here. */
const STATUS_NEEDS_TARGET = [];

function onMoveChosen(moveIdx){
  if((ui.battle.phase||'player') !== 'player') return;  // ignore clicks while a turn is still resolving
  ui.battle.phase = 'resolving';
  const mon=activeMon();
  const mv=unlockedMoves(mon)[moveIdx];
  if(mv && mv.scripted) return resolveScriptedMove(mv, mon);
  if(mv && mv.locked){ ui.battle.phase='player'; toast('Not while the Cataclysm is building.'); return; }
  if(mv && mv.chargeSpend) return resolveChargeSpend(mv, mon);
  if(mv && (mv.charge || mv.chargeMore)) return runChargeQuiz(mv, mon);
  if(mv.target==='Single' && livingEnemies().length>1){ promptTarget(mv); return; }
  if(mv.target==='Single'){ runMoveQuiz(mv, livingEnemies()[0]); return; }
  if(mv.target==='Status'){
    if(STATUS_NEEDS_TARGET.includes(mv.stoneType) && livingEnemies().length>1){ promptTarget(mv); return; }
    const t = STATUS_NEEDS_TARGET.includes(mv.stoneType) ? livingEnemies()[0] : null;
    runMoveQuiz(mv, t); return;
  }
  // High-tier twin skills: the FIRST hit is aimed by the player; the second
  // lands elsewhere at random and can never strike the same target.
  // With two enemies a twin skill hits both regardless, so only ask with three.
  if(mv.target==='Multi2' && livingEnemies().length>2){ promptTarget(mv); return; }
  runMoveQuiz(mv, mv.target==='Multi2' ? livingEnemies()[0] : null);
}
/* Explicit target picker. The old version relied on tapping the small enemy
   cards, which was easy to miss; this shows a clear list instead. */
function promptTarget(mv, onPick){
  const living = livingEnemies();
  if(living.length<=1){ (onPick||(t=>runMoveQuiz(mv,t)))(living[0]); return; }
  battleMsg('Choose a target.');
  const ov = document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(35,32,25,0.55);z-index:75;display:flex;align-items:flex-end;justify-content:center;';
  ov.innerHTML = `<div style="background:var(--paper);border-radius:18px 18px 0 0;padding:20px;max-width:480px;width:100%;">
    <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:17px;margin-bottom:4px;">${escapeHtml(mv.name)} — choose a target</div>
    <div style="font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:12px;">${living.length} enemies on the field</div>
    ${living.map((e)=>{
      const i = ui.battle.enemies.indexOf(e);
      const st = eStatuses(e).map(s=>STATUS_LABELS[s.type]||s.type).join(', ');
      return `<button class="btn btn-ghost tgt-opt" data-i="${i}" style="margin-bottom:8px;display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;">
        ${monPortrait(e.species,36,{stage:e.stage||0})}
        <span style="flex:1;">${SPECIES[e.species].name} · Lv ${e.level} · ${e.hp}/${e.maxHp} HP
        ${st?`<br><span style="font-size:11px;color:var(--cinnabar);">${st}</span>`:''}</span>
      </button>`;
    }).join('')}
    <button class="btn btn-ghost" id="tgtCancel" style="margin-top:4px;">Cancel</button>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>{ if(ov.parentNode) document.body.removeChild(ov); };
  ov.querySelector('#tgtCancel').addEventListener('click', ()=>{ close(); ui.battle.phase='player'; renderBattle(); });
  ov.addEventListener('click', e=>{ if(e.target===ov){ close(); ui.battle.phase='player'; renderBattle(); } });
  ov.querySelectorAll('.tgt-opt').forEach(b=> b.addEventListener('click', ()=>{
    close();
    const t = ui.battle.enemies[+b.dataset.i];
    (onPick||(x=>runMoveQuiz(mv,x)))(t);
  }));
}
/* Supply enough phrases to satisfy a WORD target. Shortest entries are 2
   characters, so ceil(target/2) phrases always suffices; a few spares are added
   so the quiz never runs dry if a miss shortens the run. */
function pickWords(wordTarget){
  const pool=activePool().map(w=>w.text);
  const need = Math.ceil(wordTarget/2) + 3;
  const out=[]; let bag=shuffle(pool);
  while(out.length<need){ if(bag.length===0) bag=shuffle(pool); out.push(bag.pop()); }
  return out;
}
function countWords(text){ return (text||'').length; }   // one hanzi = one word
/* Moves that cost the user HP when they land. Self-damage runs through the same
   pipeline, so Overheat correctly increases it too (per the design). */
const SELF_DAMAGE = { 'Nova': 0.15 };
/* Moves that restore their user for a share of the USER'S OWN ATK on landing. */
const LIFESTEAL = { 'Giga Drain': 0.2 };

/* Scripted moves used only inside the Rocky Caverns finale. They bypass the
   spelling quiz entirely — the drama is the point, and a writing prompt would
   undercut it. */
const SCRIPTED_MOVES = {
  tsunami:      { slot:'Basic', name:'Tsunami', mult:0.8, target:'AOE', words:0, scripted:true },
  dragonLegacy: { slot:'Basic', name:'Dragon Legacy', mult:0, target:'AOE', words:0, scripted:true, endsBattle:true },
};

function applySelfDamage(mv, mon){
  const pct = SELF_DAMAGE[mv.name];
  if(!pct) return 0;
  let dmg = pct * monAtk(mon);
  if(getPStatus(0,'overheat')) dmg *= 1.5;   // overheat raises damage taken, incl. recoil
  dmg = Math.ceil(dmg);
  const before = mon.currentHp;
  mon.currentHp = Math.max(0, mon.currentHp - dmg);
  flashHit($('#playerBob'));
  drainHp('playerHp', before, mon.currentHp, monMaxHp(mon));
  logBattle(`${mv.name} recoil: ${displayName(mon)} took ${dmg} self-damage`);
  return dmg;
}

function runMoveQuiz(mv, target){
  const carry = ui.battle ? (ui.battle.wordCarry||0) : 0;
  // A scaling move keeps going past its requirement, gaining power each word,
  // until the player slips or the cap is reached.
  const ceilWords = mv.scale
    ? mv.words + Math.ceil((mv.scale.max - mv.mult) / mv.scale.per)
    : mv.words;
  const words = pickWords(Math.max(0, ceilWords - carry));
  startQuiz({
    title:mv.name,
    subtitle:`${mv.isStone?stoneTierDef(mv.stoneTier).label+' move':(mv.slot==='Basic'?'Basic move':mv.slot)} · write ${mv.words} words to power it up${mv.scale?` — keep going for up to ${mv.scale.max}× !`:''}`,
    words, stopAtFirstMiss:true, lockExit:true,
    wordTarget: ceilWords,
    stopAt: mv.scale ? mv.words : 0,     // scaling moves may be ended once powered
    startingWords: carry,
    onComplete:(results)=>resolveBattleMove(mv,target,results),
    onExit:()=>{ go('battle'); },
  });
}

/* Words written beyond a move's requirement roll into the next move. */
function bankWordSpill(mv){
  if(!ui.battle) return 0;
  const done = (ui.quiz && ui.quiz.wordsDone) || 0;
  const spill = Math.max(0, done - mv.words);
  ui.battle.wordCarry = spill;
  return spill;
}

/* Tsunami sweeps the field; Dragon Legacy whites out and ends the sequence.
   Neither asks for a single written word. */
/* Charging: a 10-word quiz, then the turn passes. */
function runChargeQuiz(mv, mon){
  const def = mv.charge || (chargeState() && chargeState().def);
  const words = pickWords(mv.words);
  startQuiz({
    title: mv.name,
    subtitle: `Charging — write ${mv.words} words. The turn will pass while power gathers.`,
    words, stopAtFirstMiss:true, lockExit:true,
    wordTarget: mv.words,
    startingWords: (ui.battle && ui.battle.wordCarry) || 0,
    onComplete:(results)=>{
      const correct = results.filter(r=>r.passed).reduce((n,r)=>n+(r.words||countWords(r.text)),0);
      go('battle');
      if(correct < mv.words){
        battleMsg(`${mv.name} fizzled out! (${correct}/${mv.words} words)`);
        playSfx('move_miss');
        return setTimeout(enemyTurn, 900);
      }
      startCharge(mon, def);
      const c = chargeState();
      playEffect(mv.name, { type:'Water', duration:800 });
      battleMsg(`⚡ Power gathers… ${c.charges} charge${c.charges>1?'s':''} held. The turn passes.`);
      logBattle(`${displayName(mon)} charged — ${c.charges}/${c.def.max}, window ${c.turnsLeft} turns`);
      renderBattle();
      setTimeout(enemyTurn, 1100);
    },
    onExit:()=>{ go('battle'); },
  });
}

/* Spending the charge — no words needed, the price was paid to build it. */
function resolveChargeSpend(mv, mon){
  const b = ui.battle;
  const c = chargeState();
  if(!c) { b.phase='player'; return renderBattle(); }
  const atk = monAtk(mon);
  const targets = mv.target==='AOE' ? livingEnemies() : [livingEnemies()[0]];
  if(!targets[0]){ b.phase='player'; return renderBattle(); }

  const hits = targets.filter(Boolean).map(t=>{
    const dmg = computeDamage(mv.mult, atk, monRef(mon), t, true);
    return { t, idx:b.enemies.indexOf(t), dmg, oldHp:t.hp, newHp:Math.max(0,t.hp-dmg) };
  });
  battleMsg(`${mv.name}! (${c.charges} charge${c.charges>1?'s':''}, ${mv.mult.toFixed(2)}× ATK)`);
  bob($('#playerBob'), +1);
  playEffect(mv.name, { type:'Water', duration:800, at: hits[0] ? 'enemy-'+hits[0].idx : null });
  logBattle(`${displayName(mon)} spent ${c.charges} charge(s) on ${mv.name} — ${mv.mult.toFixed(2)}x`);

  setTimeout(()=>{
    applyHits(hits);
    c.turnsLeft--;
    if(c.turnsLeft <= 0){
      clearCharge();
      setTimeout(()=>{ battleMsg('The Cataclysm subsides.'); afterPlayerAttack(mon, hits); }, 700);
    } else {
      setTimeout(()=> afterPlayerAttack(mon, hits), 700);
    }
  }, 400);
}

function resolveScriptedMove(mv, mon){
  const b = ui.battle;
  if(mv.endsBattle){
    battleMsg(`${displayName(mon)} used ${mv.name}!`);
    playEffect(mv.name, { duration:900 });
    const flash = document.createElement('div');
    flash.style.cssText='position:fixed;inset:0;background:#fff;z-index:92;opacity:0;transition:opacity 1.2s;';
    document.body.appendChild(flash);
    requestAnimationFrame(()=>{ flash.style.opacity='1'; });
    setTimeout(()=>{
      if(flash.parentNode) document.body.removeChild(flash);
      restoreRealParty();
      if(b.onWin) b.onWin();
    }, 1600);
    return;
  }
  // a sweeping AOE that is certain to clear the field
  const atk = monAtk(mon);
  const hits = livingEnemies().map(t=>{
    const dmg = Math.max(t.hp, computeDamage(mv.mult, atk, monRef(mon), t, true));
    return { t, idx:b.enemies.indexOf(t), dmg, oldHp:t.hp, newHp:0 };
  });
  battleMsg(`${displayName(mon)} used ${mv.name}!`);
  bob($('#playerBob'), +1);
  playEffect(mv.name, { duration:800 });
  setTimeout(()=>{
    applyHits(hits);
    setTimeout(()=>{
      battleMsg('The field is swept clean!');
      setTimeout(()=>{ restoreRealParty(); if(b.onWin) b.onWin(); }, 900);
    }, 700);
  }, 500);
}

function restoreRealParty(){
  if(ui.realParty){ state.party = ui.realParty; ui.realParty = null; saveProfile(); }
}

function resolveBattleMove(mv, target, results){
  const mon=activeMon();
  results.filter(r=>!r.passed).forEach(r=>{ if(!ui.battle.fightMistakes.includes(r.text)) ui.battle.fightMistakes.push(r.text); });
  // Scored in WORDS now: sum the characters of every phrase written correctly,
  // plus any spill carried in from the previous move.
  const correct = results.filter(r=>r.passed).reduce((n,r)=>n+(r.words||countWords(r.text)),0)
                + (ui.quiz && ui.quiz.config ? (ui.quiz.config.startingWords||0) : 0);
  const spill = bankWordSpill(mv);
  go('battle');

  if(mv.slot==='UltraStone') ui.battle.usedUltra[mon.uid]=true;
  if(mv.isStone && mv.stoneTier==='veryhigh') ui.battle.usedVeryHigh[mon.uid]=true;

  if(mv.target==='Multi2') return resolveMulti2(mv, mon, correct, target);
  if(mv.target==='Status') return resolveStatusMove(mv, mon, target, correct);
  if(mv.target==='MultiHit') return resolveMultiHit(mv, mon, correct);

  // Single / AOE (standard species moves + Low/Mid stone moves)
  let factor = mv.isStone ? (correct>=mv.words ? mv.mult : 0) : moveFactor(mv.slot, mv.mult, mv.words, correct);
  if(mv.scale && correct > mv.words && factor > 0){
    factor = Math.min(mv.scale.max, mv.mult + mv.scale.per*(correct - mv.words));
  }
  if(factor<=0){ playSfx('move_miss'); battleMsg(`${mv.name} missed! (${correct}/${mv.words} words)`); setTimeout(enemyTurn,900); return; }
  const atk=monAtk(mon);
  const targets = mv.target==='AOE' ? livingEnemies() : [target];
  // A `hits` move lands its total damage as several strikes on ONE target, so
  // per-hit effects (Leech Seed, drains) trigger for each.
  if(mv.hits && mv.hits > 1 && targets[0]){
    return resolveSplitHits(mv, mon, factor, atk, targets[0]);
  }
  const hits = targets.map(t=>{
    const dmg = computeDamage(factor, atk, monRef(mon), t, true);
    const idx=ui.battle.enemies.indexOf(t);
    return { t, idx, oldHp:t.hp, newHp:Math.max(0,t.hp-dmg), dmg };
  });
  let effMsg=''; hits.forEach(h=>{ const m=typeMultiplier(SPECIES[mon.species].types, h.t.types); if(m!==1) effMsg=effectivenessLabel(m); });
  logBattle(`${displayName(mon)} used ${mv.name} (${correct}/${mv.words} words${spill?`, +${spill} spill`:''}) — factor ${factor.toFixed(2)}x ATK ${atk}`);
  hits.forEach(h=>logBattle(`  → ${SPECIES[h.t.species].name} took ${h.dmg} (${h.oldHp}→${h.newHp})`));
  battleMsg(`${mv.name}! ${effMsg}`);
  bob($('#playerBob'), +1);
  playEffect(mv.name, { type: mv.stoneType || SPECIES[mon.species].types[0], tier: mv.stoneTier,
                        at: hits[0] ? 'enemy-'+hits[0].idx : null });
  setTimeout(()=>{
    applyHits(hits);
    applySelfDamage(mv, mon);
    if(mon.currentHp<=0){ setTimeout(()=>onMonFainted(), 900); return; }
    afterPlayerAttack(mon, hits);
  }, 330);
}

/* apply a batch of {t,idx,oldHp,newHp} hits with flash + drain, mark fainted.
   Any hit on a Giga-Drain-marked enemy heals the active monster for 0.2x ATK. */
function applyHits(hits){
  const mon = activeMon();
  if(hits && hits.length) playSfx('hit_dealt');
  let healed = 0;
  hits.forEach(h=>{
    h.t.hp = h.newHp;
    flashHit(document.getElementById('enemy-'+h.idx));
    drainHp('enemyHp-'+h.idx, h.oldHp, h.newHp, h.t.maxHp);
    if(getEStatus(h.t,'leechSeed')) healed += Math.ceil(0.15*monAtk(mon));   // 0.15x, and it heals the WHOLE party
  });
  const ls = ui.battle && ui.battle.pendingLifesteal;
  if(ls){ healed += ls; ui.battle.pendingLifesteal = 0; }
  // Leech Seed feeds the WHOLE team, not only the monster that swung.
  if(healed>0){
    battleParty().forEach(m=>{
      if(m.currentHp<=0 || m===mon) return;
      m.currentHp = Math.min(monMaxHp(m), m.currentHp + healed);
    });
  }
  if(healed>0 && mon.currentHp>0){
    const max = monMaxHp(mon);
    const before = mon.currentHp;
    mon.currentHp = Math.min(max, mon.currentHp + healed);
    drainHp('playerHp', before, mon.currentHp, max);
    battleMsg(`Giga Drain restored ${mon.currentHp-before} HP!`);
  }
  saveProfile();
  hits.forEach(h=>{ if(h.newHp<=0){ const el=document.getElementById('enemy-'+h.idx); if(el) el.classList.add('fainted'); } });
}

/* after any player attack resolves: check overcharge repeat, then move on.
   `hits` carries the per-target damage so a repeat re-applies the real amount. */
function afterPlayerAttack(mon, hits){
  if(ui.battle && ui.battle.legacyBonus){ ui.battle.legacyBonus = 0; }   // one move only
  setTimeout(()=>{
    const oc = getPStatus(0,'overcharge');
    const canRepeat = oc && hits && hits.length && livingEnemies().length>0;
    if(canRepeat && Math.random()<oc.chance){
      battleMsg('⚡ Overcharge triggers — the attack repeats!');
      const again = hits
        .filter(h=>h.t.hp>0)
        .map(h=>({ t:h.t, idx:h.idx, oldHp:h.t.hp, newHp:Math.max(0,h.t.hp-h.dmg), dmg:h.dmg }));
      if(again.length===0){ finishPlayerTurn(); return; }
      bob($('#playerBob'), +1);
      setTimeout(()=>{
        applyHits(again);
        setTimeout(finishPlayerTurn, 850);
      }, 300);
      return;
    }
    finishPlayerTurn();
  }, 850);
}
function finishPlayerTurn(){
  if(livingEnemies().length===0){ setTimeout(onWaveCleared,700); return; }
  setTimeout(enemyTurn,850);
}

/* An Ultimate that strikes the same target repeatedly. */
function resolveSplitHits(mv, mon, factor, atk, target){
  const n = mv.hits;
  const per = factor / n;
  const hits = [];
  let simHp = target.hp;
  for(let i=0;i<n;i++){
    if(simHp<=0) break;
    const dmg = computeDamage(per, atk, monRef(mon), target, true);
    const oldHp = simHp, newHp = Math.max(0, simHp-dmg);
    simHp = newHp;
    hits.push({ t:target, idx:ui.battle.enemies.indexOf(target), dmg, oldHp, newHp });
  }
  logBattle(`${displayName(mon)} used ${mv.name} — ${hits.length} strikes on ${SPECIES[target.species].name}`);
  hits.forEach((h,i)=>logBattle(`  strike ${i+1}: ${h.dmg} (${h.oldHp}→${h.newHp})`));
  battleMsg(`${mv.name}!`);
  bob($('#playerBob'), +1);
  playEffect(mv.name, { type: SPECIES[mon.species].types[0], at:'enemy-'+hits[0].idx });
  setTimeout(()=> playSuccessiveHits(hits, 0, ()=>{
    saveProfile();
    battleMsg(`${mv.name} struck ${hits.length} times!`);
    afterPlayerAttack(mon, hits);
  }, true), 330);
}

/* High tier: hit 2 different living enemies at 0.8x each (or the single enemy once if only 1 exists) */
function resolveMulti2(mv, mon, correct, target){
  if(correct<mv.words){ battleMsg(`${mv.name} missed! (${correct}/${mv.words} words)`); setTimeout(enemyTurn,900); return; }
  const atk=monAtk(mon);
  const living = livingEnemies();
  let targets;
  if(living.length >= 2){
    const first = (target && target.hp>0) ? target : living[0];
    const others = shuffle(living.filter(e=>e !== first));   // never the primary target
    targets = others.length ? [first, others[0]] : [first];
  } else {
    targets = living.slice(0,1);
  }
  const hits = targets.map(t=>{
    const dmg = computeDamage(mv.mult, atk, monRef(mon), t, true);
    return { t, idx:ui.battle.enemies.indexOf(t), oldHp:t.hp, newHp:Math.max(0,t.hp-dmg), dmg };
  });
  logBattle(`${displayName(mon)} used ${mv.name} (High, ${mv.mult}x ATK ${atk}) on ${hits.length} target(s)`);
  hits.forEach(h=>logBattle(`  → ${SPECIES[h.t.species].name} took ${h.dmg} (${h.oldHp}→${h.newHp})`));
  battleMsg(`${mv.name}!`);
  bob($('#playerBob'), +1);
  playEffect(mv.name, { type: mv.stoneType || SPECIES[mon.species].types[0], tier: mv.stoneTier,
                        at: hits[0] ? 'enemy-'+hits[0].idx : null });
  setTimeout(()=> playSuccessiveHits(hits, 0, ()=>{
    saveProfile();
    battleMsg(`${mv.name} hit ${hits.length} time${hits.length===1?'':'s'}!`);
    afterPlayerAttack(mon, hits);
  }, true), 330);
}

/* Ultra tier: 5-7 random hits (45/35/20) spread across enemies, may repeat a target.
   Screen inverts briefly on use; hits animate at 2x speed in succession. */
function resolveMultiHit(mv, mon, correct){
  if(correct<mv.words){ battleMsg(`${mv.name} missed! (${correct}/${mv.words} words)`); setTimeout(enemyTurn,900); return; }
  const r=Math.random();
  const n = r<0.45?5:(r<0.80?6:7);
  const atk=monAtk(mon);
  // simulate against a working copy of HP so targeting skips already-downed enemies,
  // but leave real HP untouched until the animation plays it back hit by hit
  const sim = new Map(ui.battle.enemies.map(e=>[e, e.hp]));
  const hits=[];
  for(let i=0;i<n;i++){
    const alive = ui.battle.enemies.filter(e=>sim.get(e)>0);
    if(alive.length===0) break;
    const t = alive[Math.floor(Math.random()*alive.length)];
    const dmg = computeDamage(mv.mult, atk, monRef(mon), t, true);
    const oldHp = sim.get(t);
    const newHp = Math.max(0, oldHp - dmg);
    sim.set(t, newHp);
    hits.push({ t, idx:ui.battle.enemies.indexOf(t), oldHp, newHp, dmg });
  }
  invertScreen();
  logBattle(`${displayName(mon)} used ${mv.name} (Ultra) — rolled ${n} hits, landed ${hits.length}`);
  hits.forEach((h,i)=>logBattle(`  hit ${i+1} → ${SPECIES[h.t.species].name} took ${h.dmg} (${h.oldHp}→${h.newHp})`));
  battleMsg(`${mv.name} unleashed!`);
  bob($('#playerBob'), +1);
  playEffect(mv.name, { duration:700, type: mv.stoneType || SPECIES[mon.species].types[0], tier: mv.stoneTier });
  setTimeout(()=> playSuccessiveHits(hits, 0, ()=>{
    saveProfile();
    applySelfDamage(mv, mon);
    battleMsg(`${mv.name} hit ${hits.length} time${hits.length===1?'':'s'}!`);
    if(mon.currentHp<=0){ setTimeout(()=>onMonFainted(), 900); return; }
    afterPlayerAttack(mon, hits);
  }, true), 330);
}
function invertScreen(){
  document.body.classList.add('ultra-invert');
  setTimeout(()=> document.body.classList.remove('ultra-invert'), 600);
}
/* play pre-computed hits one at a time, applying HP as each lands.
   fast=true halves the gap (the multi-hit "2x speed" rule). */
function playSuccessiveHits(hits, i, done, fast){
  if(i>=hits.length){ done(); return; }
  const h = hits[i];
  const gap = fast ? 175 : 350;
  h.t.hp = h.newHp;
  flashHit(document.getElementById('enemy-'+h.idx));
  drainHp('enemyHp-'+h.idx, h.oldHp, h.newHp, h.t.maxHp);
  if(getEStatus(h.t,'leechSeed')){
    const mon = activeMon(), max = monMaxHp(mon);
    if(mon.currentHp>0){
      const before = mon.currentHp;
      mon.currentHp = Math.min(max, mon.currentHp + Math.ceil(0.2*monAtk(mon)));
      drainHp('playerHp', before, mon.currentHp, max);
    }
  }
  if(h.newHp<=0){ const el=document.getElementById('enemy-'+h.idx); if(el) el.classList.add('fainted'); }
  setTimeout(()=> playSuccessiveHits(hits, i+1, done, fast), gap);
}

/* Very High tier: single status application, per-type effect (see applyVeryHighEffect) */
function resolveStatusMove(mv, mon, target, correct){
  if(correct<mv.words){ battleMsg(`${mv.name} missed! (${correct}/${mv.words} words)`); setTimeout(enemyTurn,900); return; }
  const atk=monAtk(mon);
  const targets = target ? [target] : [];
  const res = applyVeryHighEffect(mv.stoneType, mon, atk, targets);
  bob($('#playerBob'), +1);
  playEffect(mv.name, { type: mv.stoneType, tier:'veryhigh', at: target ? 'enemy-'+ui.battle.enemies.indexOf(target) : null });
  setTimeout(()=>{
    let hits = [];
    if(res.hits && res.hits.length){
      hits = res.hits.map(h=>({ t:h.enemy, idx:ui.battle.enemies.indexOf(h.enemy), oldHp:h.enemy.hp, newHp:Math.max(0,h.enemy.hp-h.dmg), dmg:h.dmg }));
      applyHits(hits);
    }
    renderStatusBadges();
    logBattle(`${displayName(mon)} used ${mv.name} (Very High, instant) — ${res.msg}`);
    battleMsg(res.msg);
    // Very High skills are INSTANT CAST: applying a status doesn't consume the
    // turn, so the player still gets to attack. (Giga Drain's own damage tick is
    // part of applying the mark, not a separate attack.)
    setTimeout(()=>{
      if(livingEnemies().length===0){ setTimeout(onWaveCleared,600); return; }
      // Instant cast doesn't consume the turn, so control returns to the player.
      // Without this the phase stays 'resolving' and every button softlocks.
      ui.battle.phase = 'player';
      renderBattle();
      battleMsg(res.msg + ' (instant — you can still attack!)');
    }, 700);
  }, 330);
}

/* ---------- ENEMY TURN ----------
   Enemies now strike ONE AT A TIME rather than as a single lump, so a crowded
   wave builds pressure blow by blow. If the active monster faints partway
   through, the remaining attackers do NOT get their swings — the player sends
   out a replacement and the turn passes back to them. */
function enemyTurn(){
  const b = ui.battle;
  const attackers = livingEnemies();

  // Ice Tomb: frozen enemies lose their turn; tick the counter and thaw at zero
  const acting = [];
  let frozenCount = 0;
  attackers.forEach(e=>{
    const ice = getEStatus(e,'iceTomb');
    if(ice){
      frozenCount++;
      ice.turnsLeft--;
      if(ice.turnsLeft<=0) removeEStatus(e,'iceTomb');
    } else {
      acting.push(e);
    }
  });

  if(acting.length===0){
    battleMsg(frozenCount ? "The frozen enemies can't move!" : 'The enemy hesitates!');
    renderStatusBadges();
    return endEnemyRound();
  }

  b.attackQueue = acting;
  runEnemyAttack(0);
}

/* An evolved wild monster fights unpredictably: it picks from its whole
   unlocked moveset each turn instead of always using the same attack. */
function enemyMoveFor(e){
  /* The Don's dragon opens by charging Cataclysm Max for three turns, then
     hyperbeams every turn after. Its charge is tracked on the enemy itself. */
  if(e.ai === 'cataclysm'){
    e.chargeTurns = (e.chargeTurns||0) + 1;
    if(e.chargeTurns <= 3) return ['Charge','Cataclysm Max',null,'Charge',0,0];
    const charges = 3;
    return ['Ultimate','Hyperbeam',(charges-1)*0.5 + 1.75,'Single',0,0];
  }
  if(e.ai !== 'random') return e.move;
  const sp = SPECIES[e.species];
  const avail = MOVES[e.species].filter(m=>m[1]!=null && e.level>=m[5] && m[2]!=null);
  if(!avail.length) return e.move;
  return avail[Math.floor(Math.random()*avail.length)];
}

function runEnemyAttack(i){
  const b = ui.battle;
  const mon = activeMon();

  // The active monster went down mid-sequence: stop here, no free swings.
  if(mon.currentHp <= 0){
    b.attackQueue = null;
    tickStatuses();              // the round still happened — age the statuses
    return setTimeout(onMonFainted, 650);
  }
  if(livingEnemies().length === 0){ b.attackQueue = null; return setTimeout(onWaveCleared, 650); }
  if(!b.attackQueue || i >= b.attackQueue.length) return endEnemyRound();

  const e = b.attackQueue[i];
  if(!e || e.hp <= 0) return runEnemyAttack(i+1);

  const idx  = b.enemies.indexOf(e);
  const move = enemyMoveFor(e);
  const name = SPECIES[e.species].name;

  /* Per-attack rolls: Discombobulate can make this one miss, be countered, or
     land at half; Mirage can make it miss. Both are rolled per attacker now. */
  const dis = getEStatus(e,'discombobulate');
  let disHalve=false, disMiss=false, disCounter=false;
  if(dis){
    if(dis.guaranteed){
      disHalve = true; dis.guaranteed = false;
      if(b.fieldStatus && b.fieldStatus.discombobulate) b.fieldStatus.discombobulate.guaranteed = false;
      b.enemies.forEach(x=>{ const st=getEStatus(x,'discombobulate'); if(st) st.guaranteed = false; });
    } else {
      const r = Math.random();
      if(r<0.10) disCounter = true; else if(r<0.20) disMiss = true; else if(r<0.30) disHalve = true;
    }
  }
  const mir = getPStatus(0,'mirage');
  const evaded = disMiss || (mir && (mir.guaranteed || Math.random() < (mir.chance||0.20)));
  if(mir && mir.guaranteed && evaded) mir.guaranteed = false;

  bob(document.getElementById('enemyBob-'+idx), -1);
  battleMsg(`${name} used ${move[1]}!`);

  if(evaded){
    setTimeout(()=>{
      battleMsg(disMiss ? `🌀 ${name} is confused — the attack went wide!`
                        : `💨 The mirage shimmers — ${name} missed!`);
      setTimeout(()=> runEnemyAttack(i+1), 700);
    }, 300);
    return;
  }

  // a charging turn does no damage at all
  if(move[0] === 'Charge'){
    playEffect(move[1], { type:'Water', duration:700 });
    setTimeout(()=>{
      battleMsg(`⚡ ${name} gathers power… (${e.chargeTurns}/3)`);
      setTimeout(()=> runEnemyAttack(i+1), 900);
    }, 400);
    return;
  }

  playEffect(move[1], { type: e.types[0], at:'playerBob' });

  setTimeout(()=>{
    let dmg = computeDamage(move[2], e.atk, e, monRef(mon), false);
    if(disHalve) dmg = Math.ceil(dmg*0.5);

    const counter = getPStatus(0,'counter');
    const spikes  = getPStatus(0,'spikeArmour');
    const counterFires = disCounter || (counter && (counter.guaranteed || Math.random() < (counter.chance||0.10)));
    let msg = '';

    if(counterFires){
      if(counter && counter.guaranteed) counter.guaranteed = false;
      const back = Math.ceil(dmg*0.5);
      const oldHp=e.hp, newHp=Math.max(0,e.hp-back);
      e.hp = newHp;
      flashHit(document.getElementById('enemy-'+idx));
      drainHp('enemyHp-'+idx, oldHp, newHp, e.maxHp);
      if(newHp<=0){ const el=document.getElementById('enemy-'+idx); if(el) el.classList.add('fainted'); }
      msg = `🛡️ Countered! ${back} reflected back at ${name}.`;
    } else {
      const oldHp = mon.currentHp;
      // scripted last stand: the dragon always survives on 1 HP
      const floor = ui.battle.allyUnkillable ? 1 : 0;
      mon.currentHp = Math.max(floor, mon.currentHp - dmg);
      flashHit($('#playerBob'));
      playSfx('hit_taken');
      drainHp('playerHp', oldHp, mon.currentHp, monMaxHp(mon));
      msg = `${name} dealt ${dmg} damage!`;

      if(spikes && mon.currentHp>0){
        const back = Math.ceil(0.2*monAtk(mon));
        const oh=e.hp, nh=Math.max(0,e.hp-back);
        e.hp = nh;
        flashHit(document.getElementById('enemy-'+idx));
        drainHp('enemyHp-'+idx, oh, nh, e.maxHp);
        if(nh<=0){ const el=document.getElementById('enemy-'+idx); if(el) el.classList.add('fainted'); }
        msg += ` Spikes struck back for ${back}!`;
      }
    }

    // Life-stealing moves restore the attacker from its own ATK
    const pct = LIFESTEAL[move[1]];
    if(pct && e.hp>0){
      const before = e.hp;
      e.hp = Math.min(e.maxHp, e.hp + Math.ceil(pct*e.atk));
      if(e.hp>before){
        drainHp('enemyHp-'+idx, before, e.hp, e.maxHp);
        msg += ` ${name} drained ${e.hp-before} HP!`;
      }
    }

    // arena convenience
    if(b.autoHeal && mon.currentHp>0 && mon.currentHp<monMaxHp(mon)){
      const max = monMaxHp(mon), was = mon.currentHp;
      mon.currentHp = max;
      drainHp('playerHp', was, max, max);
      msg += ' (auto-healed)';
    }

    saveProfile();
    renderStatusBadges();
    logBattle(`${name} → ${msg}`);
    battleMsg(msg);

    setTimeout(()=> runEnemyAttack(i+1), 850);
  }, 330);
}

function endEnemyRound(){
  const b = ui.battle;
  b.attackQueue = null;
  if(livingEnemies().length===0){ setTimeout(onWaveCleared,700); return; }
  if(activeMon().currentHp<=0){ setTimeout(onMonFainted,700); return; }
  b.switchedThisTurn = false;
  // an unspent Cataclysm window closes on its own
  const c = chargeState();
  if(c){ c.turnsLeft--; if(c.turnsLeft <= 0){ clearCharge(); battleMsg('The gathered power disperses.'); } }
  const gone = tickStatuses();          // one full round has passed
  setTimeout(()=>{
    b.phase='player'; renderBattle();
    battleMsg(gone.length ? `${gone.join(' and ')} wore off.` : 'Choose a move.');
  }, 850);
}
function onMonFainted(){
  const c = chargeState();
  if(c && activeMon() && c.uid === activeMon().uid) triggerDragonLegacy();
  const alive=battleParty().filter(m=>m.currentHp>0);
  if(alive.length===0){ return onPlayerDefeated(); }
  battleMsg(`${displayName(activeMon())} fainted!`);
  const options=state.party.map((m,i)=>({m,i})).filter(o=>o.m.currentHp>0 && !isSeed(o.m));
  monsterChooser('Send out…', options, (i)=>{ ui.battle.activeIndex=i; ui.battle.switchedThisTurn=false; ui.battle.phase='player'; renderBattle(); battleMsg('Choose a move.'); }, false);
}
function onPlayerDefeated(){
  if(ui.battle && ui.battle.guardianTrial) return onGuardianTrialResolved();
  if(ui.battle && ui.battle.scriptedLoss==='padrino'){ restoreRealParty(); return onPadrinoResolved(); }
  playSfx('defeat'); stopMusic();
  const breakAfterLoss = tallyBattleForEyeBreak();
  const fade=document.createElement('div');
  fade.style.cssText='position:fixed;inset:0;background:#000;z-index:80;opacity:0;transition:opacity .8s;';
  document.body.appendChild(fade);
  requestAnimationFrame(()=>{ fade.style.opacity='1'; });
  setTimeout(async ()=>{
    battleParty().forEach(m=>{ m.currentHp=Math.max(1,Math.floor(monMaxHp(m)*0.10)); m.xpFights=0; });
    await saveProfile();
    go('region');
    fade.style.opacity='0';
    setTimeout(()=>document.body.removeChild(fade),800);
    toast('Your team fainted. They recovered a little.');
    if(breakAfterLoss) showEyeBreak();
  },1000);
}
/* ---------- XP / LEVELING / EVOLUTION ---------- */
/* The cap belongs to the ZONE you're standing in, not the region — Rocky
   Caverns lets you push past the rest of Emerald March. Away from any zone,
   the region's best available cap applies. */
const REGION_CAPS = { 1:21, 2:41, 3:60 };
function levelCap(){
  const z = ui.currentZone && ui.currentZone.id;
  if(z && ZONE_LEVELS[z]) return ZONE_LEVELS[z].max;
  const rid = (state.progress && state.progress.currentRegion) || 1;
  const zones = (REGION_ZONES[rid]||[]).map(x=>(ZONE_LEVELS[x.id]||{}).max||0);
  return Math.max(REGION_CAPS[rid]||21, ...zones, 0) || 21;
}
/* ---------- XP PACING MODES ----------
   Selectable (password-gated) from the Spelling List screen. `tier` counts
   5-level bands: 0 = Lv1-5, 1 = Lv6-10, 2 = Lv11-15, ...  */
const XP_MODES = {
  default: { label:'Default', desc:'2, 3, 4, 5, 6 …  (+1 every 5 levels)',
             fn: tier => 2 + tier },
  rapid:   { label:'Rapid',   desc:'1, 2, 2, 3, 3, 4, 4 …  (+1 every 10 levels)',
             fn: tier => 1 + Math.ceil(tier/2) },
  grind:   { label:'Grind',   desc:'4, 5, 6, 7, 8 …  (slower, more practice)',
             fn: tier => 4 + tier },
  dev:     { label:'Dev',     desc:'Always 1 fight per level (testing only)',
             fn: () => 1 },
};
function xpMode(){
  const m = state && state.settings && state.settings.xpMode;
  return XP_MODES[m] ? m : 'default';
}
function fightsNeeded(level){
  const tier = Math.floor((level-1)/5);
  return Math.max(1, XP_MODES[xpMode()].fn(tier));
}
function newMoveAtLevel(species, level){
  const mv = MOVES[species].find(m=>m[5]===level && m[1]!=null);
  return mv ? mv[1] : null;
}
function awardXpToParty(fightsWorth){
  const credit = Math.max(1, fightsWorth||1);
  const events = [];
  state.party.forEach(m=>{
    const sp = SPECIES[m.species];
    if(sp.frozenRegion1 && state.progress.currentRegion===1) return; // phoenix frozen
    // Past this zone's cap: freeze progress rather than discarding it, so a
    // monster raised elsewhere doesn't lose a part-finished level on arrival.
    if(m.level >= levelCap()) return;
    m.xpFights = (m.xpFights||0) + credit;
    const from = m.level;
    const evos = [], newMoves = [];
    while(m.level < levelCap() && m.xpFights >= fightsNeeded(m.level)){
      m.xpFights -= fightsNeeded(m.level);
      const beforeStage = evolutionStage(m.species, m.level);
      // Grow current HP by the change in MAX HP (which is scaled), not by the
      // raw ATK delta — using the unscaled figure left every monster a little
      // short of full after each level, and the gap compounded.
      const beforeMax = computeMaxHp(m.species, m.level, m.supplements, m);
      m.level++;
      const afterMax = computeMaxHp(m.species, m.level, m.supplements, m);
      m.currentHp = Math.min(afterMax, m.currentHp + (afterMax - beforeMax));
      const afterStage = evolutionStage(m.species, m.level);
      if(afterStage > beforeStage) evos.push(m.level);
      const nm = newMoveAtLevel(m.species, m.level);
      if(nm) newMoves.push(nm);
    }
    // reaching the cap mid-battle also freezes rather than clears
    // The Dragon Egg hatches on reaching its level, keeping everything it earned.
    if(isEgg(m) && m.level >= (SPECIES[m.species].hatchesAt||31)){
      const into = SPECIES[m.species].hatchesInto;
      const hatchedName = displayName(m);
      m.species = into;
      m.currentHp = computeMaxHp(into, m.level, m.supplements||0, m);
      if(!state.caughtSpecies.includes(into)) state.caughtSpecies.push(into);
      if(!state.encounteredSpecies.includes(into)) state.encounteredSpecies.push(into);
      events.push({ uid:m.uid, species:into, fromSpecies:'dragon_egg', name:hatchedName, from, to:m.level, evos:[m.level], newMoves:[], hatched:true });
      return;
    }
    if(m.level !== from) events.push({ uid:m.uid, species:m.species, name:displayName(m), from, to:m.level, evos, newMoves });
  });
  return events;
}

function catchPhraseCount(species){
  const t = SPECIES[species].tier;
  if(t==='legendary') return 10;
  if(t==='starter' || t==='special') return 7;
  return 5;
}

/* Move token drop chance, WILD encounters only (never NPC/boss fights).
   Base = the highest-level party monster's level, read directly as a percentage
   (a Lv25 Phoenix in the party = 25%, even if it isn't the active fighter).
   Encounter bonuses stack on top of that base. */
const TOKEN_ENCOUNTER_BONUS = { double:0.05, triple:0.10, starter:0.15, elite:0.15, legendary:0.20 };

function tokenDropChance(){
  if(!state.party.length) return 0;
  const topLevel = Math.max(...state.party.map(m=>m.level));
  let chance = topLevel / 100;               // level 25 -> 25%
  const b = ui.battle;
  if(b && Array.isArray(b.enemies)){
    const n = b.enemies.length;
    if(n >= 3) chance += TOKEN_ENCOUNTER_BONUS.triple;
    else if(n === 2) chance += TOKEN_ENCOUNTER_BONUS.double;
    // highest-value tier present on the field
    const tiers = b.enemies.map(e=>SPECIES[e.species].tier);
    if(tiers.includes('legendary'))      chance += TOKEN_ENCOUNTER_BONUS.legendary;
    else if(tiers.includes('elite'))     chance += TOKEN_ENCOUNTER_BONUS.elite;
    else if(tiers.includes('starter') || tiers.includes('special')) chance += TOKEN_ENCOUNTER_BONUS.starter;
  }
  return Math.max(0, Math.min(1, chance));
}
function rollTokenDrop(){
  // wild only — NPC and boss fights never drop tokens
  if(ui.battle && ui.battle.isNpc) return 0;
  if(Math.random() < tokenDropChance()){
    state.inventory.tokens = (state.inventory.tokens||0) + 1;
    return 1;
  }
  return 0;
}

function onBattleWon(){
  const b = ui.battle;
  if(b.guardianTrial) return onGuardianTrialResolved();
  if(b.scriptedLoss==='padrino'){ restoreRealParty(); return onPadrinoResolved(); }   // winning her is still the scripted beat
  if(inSacredGroveTrial()){
    state.progress.region2.courage = (state.progress.region2.courage||0) + 1;
    saveProfile();
  }
  // a wild win inside the Caverns moves you one step along that path
  if(ui.cavernAdvanceOnWin && !b.isNpc){
    const pid = ui.cavernAdvanceOnWin;
    ui.cavernAdvanceOnWin = null;
    advancePath(pid);
  }
  const enemyNames = b.enemies.map(e=>SPECIES[e.species].name).join(' & ');
  const levelUps = awardXpToParty();
  const tokens = rollTokenDrop();
  saveProfile();
  const evolvers = levelUps.filter(e=>e.evos.length>0);
  if(evolvers.length){
    playEvolutions(evolvers, ()=> showVictory(enemyNames, levelUps, tokens));
  } else {
    showVictory(enemyNames, levelUps, tokens);
  }
}

/* ---------- EVOLUTION SEQUENCE (9 seconds) ----------
   The silhouette flickers between the current form and a colour-inverted
   version of the evolved form, accelerating as it goes, while glowing
   particles swirl upward. It resolves onto the evolved sprite in full colour
   with the declaration. */
const EVO_TOTAL_MS   = 14000;
const EVO_REVEAL_MS  = 2800;                       // final hold on the evolved form
const EVO_FLASH_MS   = EVO_TOTAL_MS - EVO_REVEAL_MS;

/* Flip intervals shrink geometrically: slow, hesitant flickers at first,
   frantic by the end. */
function evoFlashSchedule(totalMs){
  const out = [];
  let t = 0, gap = 620;
  while(t < totalMs){
    out.push(gap);
    t += gap;
    gap = Math.max(70, gap * 0.87);
  }
  return out;
}

function playEvolutions(list, done){
  let i = 0;
  const next = ()=>{
    if(i >= list.length){ done(); return; }
    const ev = list[i++];
    playSfx('evolution');
    const sp = SPECIES[ev.species];
    const fromStage = evolutionStage(ev.species, ev.from);
    const toStage   = evolutionStage(ev.species, ev.to);

    const ov = document.createElement('div');
    ov.className = 'evo-overlay';
    ov.innerHTML = `
      <div class="evo-particles" id="evoParticles"></div>
      <div class="evo-stage">
        <div id="evoSprite" class="evo-sprite-wrap cutout">${monPortrait(ev.fromSpecies||ev.species,190,{view:'front',stage:ev.fromSpecies?0:fromStage,bare:true})}</div>
      </div>
      <div id="evoText" class="evo-text">What's happening…?</div>
      <div id="evoActions"></div>
    `;
    document.body.appendChild(ov);

    // swirling upward glow
    const pc = ov.querySelector('#evoParticles');
    for(let k=0;k<26;k++){
      const d = document.createElement('span');
      d.className = 'evo-particle';
      d.style.left = (5 + Math.random()*90) + '%';
      d.style.animationDelay = (Math.random()*2.2) + 's';
      d.style.animationDuration = (2.4 + Math.random()*2.2) + 's';
      d.style.width = d.style.height = (4 + Math.random()*7) + 'px';
      pc.appendChild(d);
    }

    const spriteBox = ov.querySelector('#evoSprite');
    const schedule = evoFlashSchedule(EVO_FLASH_MS);
    let step = 0, showEvolved = false;
    let timer = null;

    const paint = (stage, inverted)=>{
      // `fromSpecies` lets a hatch/transformation show two different species
      const sp = (stage === fromStage && ev.fromSpecies) ? ev.fromSpecies : ev.species;
      const st = (sp === ev.fromSpecies) ? 0 : stage;
      spriteBox.innerHTML = monPortrait(sp, 190, { view:'front', stage:st, bare:true });
      spriteBox.classList.toggle('inverted', !!inverted);
    };

    const tick = ()=>{
      if(step >= schedule.length){ return finish(); }
      showEvolved = !showEvolved;
      // evolved form appears colour-inverted; base form appears normally
      paint(showEvolved ? toStage : fromStage, showEvolved);
      timer = setTimeout(tick, schedule[step++]);
    };

    const finish = ()=>{
      clearTimeout(timer);
      paint(toStage, false);                       // settle on the evolved form, full colour
      spriteBox.classList.add('evo-pop');
      ov.querySelector('#evoText').innerHTML =
        `<b>${escapeHtml(ev.name)}</b> ${ev.hatched?'hatched!':'evolved!'}` +
        (ev.newMoves.length ? `<div class="evo-learn">Learned ${escapeHtml(ev.newMoves.join(', '))}!</div>` : '');
      ov.querySelector('#evoActions').innerHTML =
        `<button class="btn btn-primary" id="evoNext" style="width:auto;padding:12px 30px;">Continue</button>`;
      ov.querySelector('#evoNext').addEventListener('click', ()=>{
        if(ov.parentNode) document.body.removeChild(ov);
        next();
      });
    };

    timer = setTimeout(tick, 500);
  };
  next();
}

/* ---------- CATCHING ---------- */
function startCatch(enemy){
  const need = catchPhraseCount(enemy.species);
  // build challenge words: fight mistakes first, then fill from pool
  const mistakes = (ui.battle.fightMistakes||[]).slice();
  const poolWords = shuffle(activePool().map(w=>w.text).filter(t=>!mistakes.includes(t)));
  const words = [];
  for(const t of mistakes){ if(words.length<need) words.push(t); }
  while(words.length<need){ if(poolWords.length===0){ // refill if pool smaller than need
      const all = activePool().map(w=>w.text); if(all.length===0) break; poolWords.push(...shuffle(all)); }
    words.push(poolWords.pop());
  }
  ui.catchTarget = enemy;
  startQuiz({
    title:`Catching ${SPECIES[enemy.species].name}`,
    subtitle:`Spell ${words.length} to seal it. One slip is risky — two lets it escape!`,
    words,
    endAfterMistakes:2, lockExit:true,
    onComplete:(results)=> resolveCatch(enemy, results),
    onExit:()=>{ showVictory(ui.battle.enemies.map(e=>SPECIES[e.species].name).join(' & '), []); },
  });
}
function resolveCatch(enemy, results){
  const mistakes = results.filter(r=>!r.passed).length;
  let caught;
  if(mistakes===0) caught = true;
  else if(mistakes===1) caught = Math.random() >= 0.80; // first mistake fails 80% of the time
  else caught = false;                                   // second mistake always fails
  if(caught) gotcha(enemy);
  else {
    playSfx('catch_miss');
    go('battle'); // reuse container
    $('#brandSub').textContent='Catch';
    screenEl.innerHTML = `
      <div style="text-align:center;padding:30px 0;">
        <div style="font-size:42px;">💨</div>
        <div class="screen-title" style="text-align:center;">So close!</div>
        <div class="screen-sub" style="text-align:center;">The ${SPECIES[enemy.species].name} broke free and fled.</div>
      </div>
      <button class="btn btn-primary" id="okBtn">Continue</button>
    `;
    $('#okBtn').addEventListener('click', ()=>go('region'));
  }
}
function gotcha(enemy){
  playSfx('catch_success');
  const sp = SPECIES[enemy.species];
  const ov = document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,#fff7e0,#e8dcc0);gap:16px;';
  ov.innerHTML = `

    <div style="font-family:'Baloo 2',cursive;font-weight:800;font-size:24px;">Gotcha!</div>

    <input type="text" id="nickInput" placeholder="${sp.name}" maxlength="16" style="max-width:220px;text-align:center;">
    <button class="btn btn-primary" id="nickSave" style="width:auto;padding:12px 28px;">Add to team</button>
  `;
  document.body.appendChild(ov);
  ov.querySelector('#nickSave').addEventListener('click', async ()=>{
    const nick = ov.querySelector('#nickInput').value.trim();
    const mon = newMonster(enemy.species, enemy.level);
    if(nick){ mon.nickname = nick; mon.namedRegion = state.progress.currentRegion; }
    if(battleParty().length < 6) state.party.push(mon);
    else state.storage.push(mon);
    if(!state.caughtSpecies.includes(enemy.species)) state.caughtSpecies.push(enemy.species);
    if(!state.encounteredSpecies.includes(enemy.species)) state.encounteredSpecies.push(enemy.species);
    await saveProfile();
    document.body.removeChild(ov);
    const where = state.party.length<=6 && state.party.some(m=>m.uid===mon.uid) ? 'your party' : 'storage';
    toast(`${displayName(mon)} joined ${where}!`);
    go('region');
  });
}

function go(screen){
  if(screen !== 'quiz') document.body.classList.remove('writing');
  if(!['zone','caverns','battle','quiz'].includes(screen)) document.body.classList.remove('zone-dark','zone-tinted');
  // Protected screens re-lock as soon as you leave them, so the password is
  // required on every visit. The arena stays unlocked while you're actually
  // fighting in it (arena -> battle -> arena), otherwise testing would prompt
  // for the password after every single bout.
  if(ui.spellingUnlocked && screen !== 'spelling') ui.spellingUnlocked = false;
  if(ui.arenaUnlocked && screen !== 'arena' && screen !== 'battle') ui.arenaUnlocked = false;
  if(ui.xpUnlocked && screen !== 'sound') ui.xpUnlocked = false;
  ui.screen = screen;
  render();
}

function timeAgo(ts){
  if(!ts) return 'never';
  const d = Date.now()-ts;
  const mins = Math.floor(d/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h ago';
  const days = Math.floor(hrs/24);
  return days===1 ? 'yesterday' : days+'d ago';
}

async function handleProfileImport(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);

    // New bundle format holds { profile, wordlist }; older files were a bare profile.
    const isBundle = data && (data.format === 'bokemon-backup' || data.format === 'word-catcher-backup') && data.profile;
    const prof = isBundle ? data.profile : data;

    if(!prof || !prof.name || !prof.party || !prof.starterSpecies){
      toast("That doesn't look like a 博刻MON backup.");
      e.target.value='';
      return;
    }

    state = normalizeProfile(prof);
    await saveProfile();

    let wordMsg = '';
    if(isBundle){
      if(Array.isArray(data.localWords))  localWords  = data.localWords.slice();
      if(Array.isArray(data.hiddenWords)) hiddenWords = data.hiddenWords.slice();
      if(Array.isArray(data.wordlist)){
        // v1 backups stored {text,priority,regular} objects; v2 stores strings.
        const texts = data.wordlist.map(w => typeof w==='string' ? w : w && w.text).filter(Boolean);
        // anything not already coming from words.txt is kept as a local word
        texts.forEach(t=>{ if(!remoteWords.includes(t) && !localWords.includes(t)) localWords.push(t); });
        // v1 carried the checkmarks on the list itself — migrate them onto the profile
        data.wordlist.forEach(w=>{
          if(w && typeof w==='object' && w.text){
            state.wordFlags = state.wordFlags || {};
            state.wordFlags[w.text] = { priority:!!w.priority, regular:w.regular!==false };
          }
        });
      }
      await saveWordlist();
      await saveProfile();
      wordMsg = ` and ${masterWords.length} words`;
    }

    toast(`Restored ${state.name}${wordMsg}!`);
    go('home');
  }catch(err){
    toast("Couldn't read that file.");
  }
  e.target.value='';
}

/* The Crown panel on a monster's Stats page. */
function crownBlock(m){
  if(isSeed(m) || isEgg(m)) return '';
  const owned = state.inventory.crowns||0;
  if(isCrowned(m)){
    return `<div class="crown-panel crowned">
      <div class="crown-title">${crownIcon(18)} Crowned</div>
      <div class="crown-sub">${baseTier(m.species)==='legendary'
        ? 'Carries three extra evolutions\' worth of strength.'
        : 'Raised to legendary growth, with the legendary protein cap.'}</div>
    </div>`;
  }
  const ok = crownEligible(m);
  const why = ok ? '' : crownBlockReason(m);
  return `<div class="crown-panel">
    <div class="crown-title">${crownIcon(18)} Crown <span>${owned} held</span></div>
    <div class="crown-sub">${baseTier(m.species)==='legendary'
      ? 'Would grant three more evolutions\' worth of strength.'
      : 'Would raise this monster to legendary growth and unlock the legendary protein cap.'}</div>
    ${ok && owned>0
      ? `<button class="btn btn-primary" id="useCrown" style="margin-top:10px;">Use a Crown</button>`
      : `<div class="crown-why">${owned>0 ? escapeHtml(why) : 'You have no Crowns.'}</div>`}
  </div>`;
}

function confirmCrown(m){
  const legendary = baseTier(m.species)==='legendary';
  const before = monAtk(m);
  const after = computeMaxStat(m.species, m.level, m.supplements, Object.assign({}, m, {crowned:true}));
  confirmDialogHtml(
    `Crown <b>${escapeHtml(displayName(m))}</b>?<br><br>` +
    (legendary
      ? `It gains three more evolutions' worth of strength.`
      : `It rises to <b>legendary growth</b>, and its protein cap goes from ${proteinCap(m.species,m)} to 10 — ` +
        `so it will need more Supplements to fill again.`) +
    `<br><br>ATK <b>${before} → ${after}</b><br><br>` +
    `<i>Crowns are rare. This cannot be undone.</i>`,
    async ()=>{
      if((state.inventory.crowns||0) < 1){ toast('You have no Crowns.'); return; }
      const snapshot = state.inventory.crowns;
      state.inventory.crowns--;
      m.crowned = true;
      m.currentHp = Math.min(monMaxHp(m), m.currentHp + (monMaxHp(m) - Math.ceil(monMaxHp(m)/1.2)));
      const sv = showSyncingOverlay('Syncing…');
      const okc = await saveProfile({ awaitCloud:true });
      hideSyncingOverlay(sv);
      if(!okc){ state.inventory.crowns = snapshot; m.crowned = false; showSyncFailure(); return; }
      playSfx('evolution');
      toast(`✦ ${displayName(m)} is crowned!`);
      renderStats();
    });
}

function renderStats(){
  const m = state.party.find(x=>x.uid===ui.statsUid) || state.storage.find(x=>x.uid===ui.statsUid);
  if(!m){ return go('party'); }
  $('#brandSub').textContent = 'Stats';
  const sp = SPECIES[m.species];
  const maxHp = monMaxHp(m);
  const need = fightsNeeded(m.level);
  const capped = m.level>=levelCap();
  const suppCap = isSeed(m) ? 0 : proteinCap(m.species);
  const atCap = (m.supplements||0) >= suppCap;
  const nextIsFinal = (m.supplements||0) === suppCap-1;
  const moves = MOVES[m.species].map(mv=>{
    const [slot,name,mult,target,words,unlock]=mv;
    const unlocked = name!=null && m.level>=unlock;
    return { slot,name,mult,target,words,unlock,unlocked };
  });
  [[m.equippedStone,'Basic'], [m.power1Stone,'Power1']].forEach(([st, slot])=>{
    if(!st) return;
    const t = stoneTierDef(st.tier);
    const bi = moves.findIndex(x=>x.slot===slot);
    if(bi<0) return;
    moves[bi] = { slot, name:st.name+' 💎', mult:t.mult,
      target:t.kind==='status'?'Status':(t.kind==='multi2'?'2 targets':'Single'),
      words:t.words, unlock:0, unlocked:true };
  });
  if(m.ultraStone){
    const t = stoneTierDef('ultra');
    moves.push({ slot:'Ultra Stone', name:m.ultraStone.name+' 💎', mult:t.mult, target:'5–7 hits', words:t.words, unlock:0, unlocked:true });
  }
  screenEl.innerHTML = `
    <button class="back-link" id="backBtn">← Party</button>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
      ${monPortrait(m.species,72,{stage:monStage(m)})}
      <div style="flex:1;">
        <div style="font-family:'Baloo 2',cursive;font-weight:800;font-size:20px;">${escapeHtml(displayName(m))}</div>
        <div style="font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:4px;">${sp.name}${m.nickname?'':' '}</div>
        <div>${typeBadges(m.species)}</div>
      </div>
    </div>
    <div id="nameArea" style="margin-bottom:12px;"></div>

    <div class="hp-card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-weight:800;font-size:15px;">
        <span>Level ${m.level}${capped?' (region cap)':''}</span>
        <span style="color:var(--ink-soft);">${capped?'':`${m.xpFights}/${need} fights`}</span>
      </div>
      ${capped?'':`<div class="hpbar" style="margin-top:8px;height:9px;"><div class="hpfill" style="width:${m.xpFights/need*100}%;background:var(--gold);"></div></div>`}
      <div style="display:flex;gap:20px;margin-top:12px;font-weight:800;">
        <div>❤️ HP <span style="color:var(--jade-dark);">${maxHp}</span></div>
        <div>⚔️ ATK <span style="color:var(--cinnabar-dark);">${monAtk(m)}</span></div>
      </div>
      <div style="font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:8px;">
        💪 Protein boosts: ${m.supplements||0} / ${suppCap}
        ${atCap ? `<span style="color:var(--gold);">· maxed, final boost counted triple</span>` : ''}
      </div>
      ${nextIsFinal && !atCap ? `<div style="font-size:11px;font-weight:800;color:var(--gold);margin-top:4px;">⭐ The last boost is worth TRIPLE — finish the set!</div>` : ''}
      ${(state.inventory.protein>0 && !atCap) ? `<button class="btn btn-jade" id="useProtein" style="margin-top:10px;">Use Protein Supplement (${state.inventory.protein} left)</button>` : ''}
      ${crownBlock(m)}
    </div>

    <div style="font-weight:800;font-size:14px;margin-bottom:8px;">Moves</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${moves.map(mv=>`
        <div style="background:${mv.unlocked?'var(--paper-2)':'var(--paper-3)'};border:1px solid var(--line);border-radius:12px;padding:12px;${mv.unlocked?'':'opacity:0.7;'}">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:15px;">${mv.unlocked?escapeHtml(mv.name):'???'}</div>
            <div style="font-size:11px;font-weight:800;color:var(--ink-soft);">${mv.slot}</div>
          </div>
          <div style="font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:3px;">
            ${mv.unlocked
              ? `${mv.mult!=null?(mv.mult+'× ATK'):'Support'} · ${mv.target} · ${mv.words} words`
              : `Unlocks at Lv ${mv.unlock}`}
          </div>
        </div>
      `).join('')}
    </div>
  `;
  $('#backBtn').addEventListener('click', ()=>go('party'));
  // naming: unnamed can be named anytime; a named monster can be renamed once,
  // and only after progressing to a later region than where it was named.
  const nameArea = $('#nameArea');
  if(nameArea){
    const unnamed = !m.nickname;
    const bronze = (state.medals && state.medals.bronze) || 0;
    const canRename = !unnamed && bronze > 0;      // renaming costs 1 Bronze Medal
    if(unnamed || canRename){
      nameArea.innerHTML = `
        <div style="display:flex;gap:8px;">
          <input type="text" id="nameInput" placeholder="${unnamed?'Give it a nickname':'New nickname'}" maxlength="16" style="flex:1;">
          <button class="btn btn-jade" id="nameSave" style="width:auto;padding:12px 16px;">${unnamed?'Name':'Rename'}</button>
        </div>
        ${unnamed?'<div style="font-size:11px;color:var(--ink-soft);font-weight:600;margin-top:5px;">Naming is free the first time.</div>'

        m.nickname = v;
        m.namedRegion = state.progress.currentRegion;
        await saveProfile();
        toast(unnamed ? 'Name saved!' : 'Renamed! 🥉 1 Bronze Medal spent.');
        renderStats();
      });
    } else if(!unnamed){
      nameArea.innerHTML = `<div style="font-size:11px;color:var(--ink-soft);font-weight:600;">Earn a 🥉 Bronze Medal to rename this monster.</div>`;
    }
  }
  const cb = $('#useCrown');
  if(cb) cb.addEventListener('click', ()=> confirmCrown(m));
  const up = $('#useProtein');
  if(up) up.addEventListener('click', async ()=>{
    if(state.inventory.protein<=0 || (m.supplements||0)>=suppCap) return;
    const wasFinal = (m.supplements||0) === suppCap-1;
    const beforeProtein = state.inventory.protein;
    const beforeSupp = m.supplements||0;
    const beforeHp = m.currentHp;
    const beforeMax = monMaxHp(m);
    m.supplements = beforeSupp+1;
    state.inventory.protein--;
    const afterMax = monMaxHp(m);
    m.currentHp = Math.min(afterMax, m.currentHp + (afterMax-beforeMax));

    const sov = showSyncingOverlay('Syncing…');
    const ok = await saveProfile({ awaitCloud:true });
    hideSyncingOverlay(sov);
    if(!ok){
      m.supplements = beforeSupp;
      state.inventory.protein = beforeProtein;
      m.currentHp = beforeHp;
      showSyncFailure();
      return;
    }
    playSfx('protein_use');
    toast(wasFinal ? `${displayName(m)} maxed out! Final boost counted TRIPLE.` : `${displayName(m)} grew stronger!`);
    renderStats();
  });
}

function renderStoneList(){
  const el = $('#stoneList');
  if(!el) return;
  if(state.moveStones.length===0){
    el.innerHTML = `<div class="col-empty">No skill stones yet.</div>`;

  // rarest first, so the good stuff is never buried

/* gacha spin with a short suspense reveal */
/* ---------- Commit-before-reveal helpers ----------
   Used only for economy actions where a reload-before-sync could be exploited
   (see any spend/roll/recycle below). Nothing is shown until the cloud has
   confirmed the write, so there's nothing to reload away from. */
function showSyncingOverlay(label){
  const ov = document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(35,32,25,0.55);gap:12px;';
  ov.innerHTML = `<div style="font-size:38px;">☁️</div><div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:15px;color:#fff;">${escapeHtml(label||'Syncing…')}</div>`;
  document.body.appendChild(ov);
  return ov;
}
function hideSyncingOverlay(ov){ if(ov && ov.parentNode) document.body.removeChild(ov); }
function showSyncFailure(){
  toast("☁️ Couldn't confirm online — check your connection and try again.");
}

async function doStoneRoll(){
  if((state.inventory.tokens||0) < TOKENS_PER_ROLL) return;
  const beforeTokens = state.inventory.tokens;
  state.inventory.tokens -= TOKENS_PER_ROLL;
  const stone = newMoveStone();
  state.moveStones.push(stone);

  const ov = showSyncingOverlay('Syncing…');
  const ok = await saveProfile({ awaitCloud:true });
  hideSyncingOverlay(ov);
  if(!ok){
    state.inventory.tokens = beforeTokens;
    state.moveStones.pop();
    showSyncFailure();
    return;
  }
  showStoneReveal(stone, 'Rolling…');
}

/* Shared reveal animation for every way a stone can be obtained. */
function showStoneReveal(stone, spinLabel, thenScreen){
  playSfx('stone_roll');

  ov.innerHTML = `<div id="rollSpin" style="font-size:64px;">🎰</div>
    <div id="rollText" style="font-family:'Baloo 2',cursive;font-weight:800;font-size:20px;color:var(--ink-soft);">${escapeHtml(spinLabel||'Rolling…')}</div>`;
  document.body.appendChild(ov);

    fadeOutSfx('stone_roll', 500);      // spin sound eases out as the result lands
    playStoneSfx(stone.tier);
    ov.querySelector('#rollSpin').textContent = '💎';

    ov.querySelector('#rollText').outerHTML = `
      <div style="text-align:center;">

      </div>
      <button class="btn btn-primary" id="rollOk" style="width:auto;padding:12px 30px;margin-top:14px;">Nice!</button>`;
    ov.querySelector('#rollOk').addEventListener('click', ()=>{
      if(ov.parentNode) document.body.removeChild(ov);

function openStoneDetail(uid){

  const isUltra = s.tier==='ultra';

  ov.innerHTML = `<div style="background:var(--paper);border-radius:18px;padding:20px;max-width:340px;width:100%;box-shadow:0 12px 40px var(--shadow);">
    <div style="text-align:center;">

      <div style="margin-top:5px;"><span class="type-badge" style="background:${TYPE_COLORS[s.type]}">${s.type}</span></div>
      <div style="font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:8px;line-height:1.5;">

        ${stoneDescription(s)}
      </div>
      <div style="font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:8px;">
        Teachable to <b>${s.type}</b>-type monsters${isUltra?' · adds a 5th move button':' · replaces the '+(s.tier==='high'?'Power1':'Basic')+' move'}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
      <button class="btn btn-primary" id="stUse">Use</button>
      <button class="btn btn-ghost" id="stRecycle">Recycle (+${RECYCLE_RETURN[s.tier]} tokens)</button>
      <button class="btn btn-ghost" id="stBack">Back</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>{ if(ov.parentNode) document.body.removeChild(ov); };
  ov.querySelector('#stBack').addEventListener('click', close);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
  ov.querySelector('#stRecycle').addEventListener('click', ()=>{
    close();
    confirmDialog(`Recycle ${s.name} for ${RECYCLE_RETURN[s.tier]} tokens? This destroys the stone.`, async ()=>{
      const beforeTokens = state.inventory.tokens||0;
      const i = state.moveStones.findIndex(x=>x.uid===uid);
      if(i<0) return;
      const removed = state.moveStones.splice(i,1)[0];
      state.inventory.tokens = beforeTokens + RECYCLE_RETURN[s.tier];

      const sov = showSyncingOverlay('Syncing…');
      const ok = await saveProfile({ awaitCloud:true });
      hideSyncingOverlay(sov);
      if(!ok){
        state.moveStones.splice(i,0,removed);
        state.inventory.tokens = beforeTokens;
        showSyncFailure();
        return;
      }
      toast(`Recycled for ${RECYCLE_RETURN[s.tier]} tokens.`);
      renderStorage();
    });
  });
  ov.querySelector('#stUse').addEventListener('click', ()=>{ close(); chooseStoneRecipient(s); });
}

function stoneDescription(s){
  const d = {
    Fire:'Overheat: deal 1.5× damage, but take 1.5× damage too.',
    Water:'Ice Tomb: freeze a foe 3–5 turns (it takes half damage while frozen).',
    Grass:'Giga Drain: mark a foe — every hit on it heals your monster.',
    Electric:'Overcharge: 25% chance to repeat your attacks.',
    Ground:'Spike Armour: take 20% less damage, reflect 0.4× ATK.',
    Flying:'Mirage: your whole team gains a 20% chance to evade.',
    Physical:'Counter: negate the next hit and reflect 50% of it.',
    Ghost:'Curse: the foe takes 25% more damage.',
    Psychic:'Discombobulate: the foe deals 20% less damage.',
  };
  if(s.tier==='veryhigh') return (d[s.type]||'') + '<br><i>Once per battle.</i>';
  if(s.tier==='ultra') return 'Hits 5–7 times across the enemies.<br><i>Once per battle.</i>';
  if(s.tier==='high') return 'Strikes two different enemies.';
  return '';
}

/* pick which owned monster of the matching type learns the stone */
function chooseStoneRecipient(s){
  const all = [...state.party, ...state.storage];
  const eligible = all.filter(m=>!isSeed(m) && SPECIES[m.species].types.includes(s.type));
  if(eligible.length===0){
    toast(`You have no ${s.type}-type monsters yet.`);
    return;
  }
  const isUltra = s.tier==='ultra';
  const ov = document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(35,32,25,0.55);z-index:75;display:flex;align-items:flex-end;justify-content:center;';
  ov.innerHTML = `<div style="background:var(--paper);border-radius:18px 18px 0 0;padding:20px;max-width:480px;width:100%;max-height:75vh;overflow-y:auto;">
    <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:17px;margin-bottom:4px;">Teach ${escapeHtml(s.name)} to…</div>
    <div style="font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:12px;">${isUltra?'Adds a 5th move button.':`Replaces the monster's ${s.tier==='high'?'Power1':'Basic'} move.`}</div>
    ${eligible.map(m=>{
      // Look at the slot THIS stone will occupy — High goes to Power1, so it
      // never displaces a Basic-slot skill and shouldn't warn about one.
      const cur = isUltra ? m.ultraStone : (s.tier==='high' ? m.power1Stone : m.equippedStone);
      return `<button class="btn btn-ghost st-opt" data-uid="${m.uid}" style="margin-bottom:8px;display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;">
        ${monPortrait(m.species,36,{stage:monStage(m)})}
        <span style="flex:1;">${escapeHtml(displayName(m))} · Lv ${m.level}
        ${cur?`<br><span style="font-size:11px;color:var(--cinnabar);">replaces ${escapeHtml(cur.name)}</span>`:''}</span>
      </button>`;
    }).join('')}
    <button class="btn btn-ghost" id="stCancel" style="margin-top:4px;">Cancel</button>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>{ if(ov.parentNode) document.body.removeChild(ov); };
  ov.querySelector('#stCancel').addEventListener('click', close);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
  ov.querySelectorAll('.st-opt').forEach(b=> b.addEventListener('click', async ()=>{
    const uid = b.dataset.uid;
    const mon = all.find(m=>m.uid===uid);
    const replaced = isUltra ? mon.ultraStone : (s.tier==='high' ? mon.power1Stone : mon.equippedStone);
    const doIt = async ()=>{
      if(isUltra) mon.ultraStone = { tier:s.tier, type:s.type, name:s.name };
      else if(s.tier==='high') mon.power1Stone = { tier:s.tier, type:s.type, name:s.name };
      else        mon.equippedStone = { tier:s.tier, type:s.type, name:s.name };
      const i = state.moveStones.findIndex(x=>x.uid===s.uid);
      if(i>=0) state.moveStones.splice(i,1);
      await saveProfile();
      close();
      playStoneSfx(s.tier);
      toast(`${displayName(mon)} learned ${s.name}!`);
      renderStorage();
    };
    if(replaced){
      close();
      confirmDialog(`${displayName(mon)} already knows ${replaced.name}. Replace it? The old move is lost.`, doIt);
    } else {
      await doIt();
    }
  }));
}

function moveToParty(uid){
  const idx = state.storage.findIndex(m=>m.uid===uid);
  if(idx<0) return;
  if(battleParty().length<6){
    const [m]=state.storage.splice(idx,1);
    state.party.push(m);
    saveProfile();
    toast(`${displayName(m)} joined your party.`);
    renderStorage();
  } else {
    // party full — choose who to swap out
    const options = state.party.map((m,i)=>({m,i}));
    monsterChooser('Party is full — swap out…', options, (i)=>{
      const stored = state.storage.splice(idx,1)[0];
      const removed = state.party.splice(i,1,stored)[0];
      state.storage.push(removed);
      saveProfile();
      toast(`${displayName(stored)} swapped in for ${displayName(removed)}.`);
      renderStorage();
    });
  }
}

/* ---------- RECOVERY / HEALING (Phase 6) ----------
   - tests recently-wrong words first, then the SRS/active pool
   - correct answer heals 10% max HP to the WHOLE party
   - a miss starts a 3-rep remedial loop (needs 3 consecutive correct; any miss
     resets it); loop reps grant no heal, completing the loop heals 5% to all
   - remediated words still stay in the recent-wrong history for future sessions */
function monMax(m){ return computeMaxHp(m.species, m.level, m.supplements, m); }
function partyFull(){ return battleParty().every(m=>m.currentHp>=monMax(m)); }
function healParty(pct){
  playSfx('recovery_heal');
  // Round UP (and heal at least 1) so a monster on very low HP always makes
  // progress — flooring could yield 0 and leave it permanently stuck.
  battleParty().forEach(m=>{
    const max = monMax(m);
    const gain = Math.max(1, Math.ceil(max*pct));
    m.currentHp = Math.min(max, m.currentHp + gain);
  });
  saveProfile();
}

function startRecovery(){
  const pool = activePool().map(w=>w.text);
  if(pool.length===0){ ui.prevScreen='recover'; toast('No words selected, please select to proceed.'); go('spelling'); return; }
  const inPool = new Set(pool);
  const recent = (state.recentWrong||[]).filter(w=>inPool.has(w));
  ui.recovery = {
    recentQueue: recent.slice(),
    poolBag: shuffle(pool),
    remedial: null,          // { word, streak }
    healedCount: 0,
    startHp: partyHpTotal(),
  };
  recoveryStep();
}
function partyHpTotal(){ return state.party.reduce((s,m)=>s+Math.max(0,m.currentHp),0); }

function nextRecoveryWord(){
  const r = ui.recovery;
  if(r.remedial) return r.remedial.word;
  if(r.recentQueue.length) return r.recentQueue[0];
  if(r.poolBag.length===0) r.poolBag = shuffle(activePool().map(w=>w.text));
  return r.poolBag[0];
}

function recoveryStep(){
  if(partyFull()){ return finishRecovery(); }
  const word = nextRecoveryWord();
  const r = ui.recovery;
  r.current = word;
  const remedial = !!r.remedial;
  startQuiz({
    title:'Recover',
    subtitle: remedial ? `Practice: get this right ${3-r.remedial.streak} more time${3-r.remedial.streak===1?'':'s'} in a row` : 'Spell it right to heal your whole team.',
    words:[word],
    recovery:true,
    onComplete:(results)=> onRecoveryWord(results[0].passed),
    onExit: finishRecovery,
  });
}
function consumeCurrent(r){
  if(r.recentQueue[0]===r.current) r.recentQueue.shift();
  else if(r.poolBag[0]===r.current) r.poolBag.shift();
}
function onRecoveryWord(passed){
  const r = ui.recovery;
  if(r.remedial){
    if(passed){
      r.remedial.streak++;
      // Each correct rep pays 5% immediately — three reps earn 15% in total,
      // rather than nothing until the loop completes.
      healParty(0.05);
      toast(`+5% HP to the team! (${r.remedial.streak}/3)`);
      if(r.remedial.streak>=3){
        consumeCurrent(r);
        r.remedial = null;
        r.healedCount++;
      }
    } else {
      r.remedial.streak = 0; // any miss resets the loop
    }
  } else {
    if(passed){
      healParty(0.10);
      r.healedCount++;
      consumeCurrent(r);
      toast('Nice! +10% HP to the team.');
    } else {
      r.remedial = { word: r.current, streak:0 }; // begin remedial loop on this word
    }
  }
  recoveryStep();
}

function finishRecovery(){
  stopTimer();
  const r = ui.recovery || { healedCount:0 };
  $('#brandSub').textContent = 'Recover';

  if(!battleParty().some(m=>m.currentHp>0)){ toast('Your team needs healing first.'); return false; }

function onChallengeWon(){
  const b = ui.battle;
  // NPC fights are worth 2 fights' XP per wave (e.g. the 5-wave Rival = 10)
  const waves = Array.isArray(b.waves) ? b.waves.length : 1;

  return {
    species:'rat', level:1, maxHp:ARENA_DUMMY_HP, hp:ARENA_DUMMY_HP, atk:10,
    move:['Basic','Test Jab',0.2,'Single',1,1],
    types:[type], stage:0, tier:'wild', ai:'basic', nerfed:true,
    isDummy:true, dummyType:type,
  };
}

function startArena(uid, count, type){
  const idx = state.party.findIndex(m=>m.uid===uid);
  if(idx<0){
    // pull the chosen monster out of storage into slot 0 for testing
    const si = state.storage.findIndex(m=>m.uid===uid);
    if(si>=0){ const [m]=state.storage.splice(si,1); state.party.unshift(m); saveProfile(); }
  }
  const ai = state.party.findIndex(m=>m.uid===uid);
  ui.battle = {
    waves:[[]], waveIndex:0, isNpc:false, allowCatch:false, name:'Test Arena',
    onWin:null, switchedThisTurn:false, busy:false, fightMistakes:[], phase:'player', wordCarry:0,
    partyStatus:{}, fieldStatus:{}, usedVeryHigh:{}, usedUltra:{},
    arena:true, arenaCount:count, arenaType:type,
  };
  ui.battle.enemies = Array.from({length:count}, ()=>makeDummy(type));
  ui.battle.activeIndex = ai>=0?ai:0;
  go('battle');
}

/* In arena mode every move is available and skips the quiz entirely. */
function arenaMoveList(m){
  const out = [];
  MOVES[m.species].forEach(mv=>{
    const [slot,name,mult,target,words,unlock]=mv;
    if(name==null) return;
    out.push({ slot,name,mult,target,words,unlock,available:true,isStone:false });
  });
  if(m.equippedStone){
    const t=stoneTierDef(m.equippedStone.tier);
    out.push({ slot:'Basic', name:m.equippedStone.name, mult:t.mult,
      target:t.kind==='multi2'?'Multi2':(t.kind==='status'?'Status':'Single'),
      words:t.words, unlock:0, available:!ui.battle.usedVeryHigh[m.uid] || t.id!=='veryhigh',
      isStone:true, stoneTier:t.id, stoneType:m.equippedStone.type });
  }
  if(m.ultraStone){
    const t=stoneTierDef('ultra');
    out.push({ slot:'UltraStone', name:m.ultraStone.name, mult:t.mult, target:'MultiHit',
      words:t.words, unlock:0, available:!ui.battle.usedUltra[m.uid],
      isStone:true, stoneTier:'ultra', stoneType:m.ultraStone.type });
  }
  return out;
}

/* fire a move in arena mode: auto full-success, no quiz */
function arenaFire(mv){
  const full = Array.from({length:Math.ceil(mv.words/2)}, ()=>({ text:'测试', passed:true, words:2 }));
  const needTarget = (mv.target==='Single') || (mv.target==='Status' && STATUS_NEEDS_TARGET.includes(mv.stoneType));
  if(needTarget && livingEnemies().length>1){
    promptTarget(mv, (t)=> resolveBattleMove(mv, t, full));
    return;
  }
  const target = needTarget ? livingEnemies()[0] : null;
  resolveBattleMove(mv, target, full);
}

/* Faceted CSS gems, drawn in code so no art files are needed. Higher tiers gain
   a glowing aura; Ultra additionally emits drifting motes like an evolution. */
function gemIcon(tier, size){
  const px = size || 44;
  const glow = (tier==='ultra'||tier==='veryhigh'||tier==='high') ? ' glow' : '';
  const motes = tier==='ultra'
    ? `<span class="gem-motes">${Array.from({length:6},(_,i)=>`<i style="left:${10+i*15}%;animation-delay:${i*0.35}s"></i>`).join('')}</span>`
    : '';
  return `<span class="gem-wrap" style="width:${px}px;height:${px}px;">${motes}<span class="gem tier-${tier}${glow}"></span></span>`;
}

function medalCount(cur){
  if(cur==='tokens') return state.inventory.tokens||0;
  return (state.medals && state.medals[cur]) || 0;
}
function curIcon(cur){ return cur==='tokens' ? '🎫' : medalIcon(cur); }
function curName(cur){
  return cur==='tokens' ? 'Skill Tokens'
       : cur.charAt(0).toUpperCase()+cur.slice(1)+' Medals';
}
async function spend(cur, amount){
  if(medalCount(cur) < amount) return false;
  if(cur==='tokens') state.inventory.tokens -= amount;
  else state.medals[cur] -= amount;
  return true;
}

/* Quantity purchase with − / + / Max (Skill Tokens). */
function openQtyPurchase(w){
  const pr = SHOP_PRICES[w.id];
  const max = Math.floor(medalCount(pr.cur)/pr.cost);
  let qty = max>0 ? 1 : 0;
  const ov = shopOverlay(pr.cur, `
    <div class="qty-card">
      <div class="ware-icon big">${w.icon}</div>
      <div class="ware-name" style="font-size:19px;">${escapeHtml(w.name)}</div>
      <div class="ware-desc" style="margin-bottom:14px;">${curIcon(pr.cur)} ${pr.cost} ${curName(pr.cur)} each</div>
      <div class="qty-row">
        <button class="qty-btn" id="qMinus">−</button>
        <div class="qty-val" id="qVal">${qty}</div>
        <button class="qty-btn" id="qPlus">+</button>
        <button class="qty-btn wide" id="qMax">Max</button>
      </div>
      <div class="ware-desc" id="qTotal" style="margin-top:10px;"></div>
      <button class="btn btn-primary" id="qBuy" style="margin-top:14px;" ${qty?'':'disabled'}>Buy</button>
      <button class="btn btn-ghost" id="qCancel" style="margin-top:8px;">Cancel</button>
    </div>`);
  const refresh = ()=>{
    ov.querySelector('#qVal').textContent = qty;
    ov.querySelector('#qTotal').textContent = qty ? `Total: ${curIcon(pr.cur)} ${qty*pr.cost}` : 'Not enough medals.';
    ov.querySelector('#qPlus').disabled = qty >= max;
    ov.querySelector('#qMinus').disabled = qty <= 1;
    ov.querySelector('#qBuy').disabled = qty < 1;
  };
  refresh();
  const close = ()=>{ if(ov.parentNode) document.body.removeChild(ov); };
  ov.querySelector('#qCancel').addEventListener('click', close);
  ov.querySelector('#qMinus').addEventListener('click', ()=>{ if(qty>1){ qty--; refresh(); } });
  ov.querySelector('#qPlus').addEventListener('click', ()=>{ if(qty<max){ qty++; refresh(); } });
  ov.querySelector('#qMax').addEventListener('click', ()=>{ qty = max; refresh(); });
  ov.querySelector('#qBuy').addEventListener('click', async ()=>{
    if(qty<1) return;
    const before = medalCount(pr.cur);
    if(!await spend(pr.cur, qty*pr.cost)) return;
    state.inventory.tokens = (state.inventory.tokens||0) + qty;
    const sv = showSyncingOverlay('Syncing…');
    const ok = await saveProfile({ awaitCloud:true });
    hideSyncingOverlay(sv);
    if(!ok){ state.medals[pr.cur] = before; state.inventory.tokens -= qty; showSyncFailure(); return; }
    playSfx('stone_low');
    close();
    toast(`Bought ${qty} Skill Token${qty>1?'s':''}!`);
    renderShop();
  });
}

function openSinglePurchase(w){

  const ov = shopOverlay(pr.cur, `

      <button class="btn btn-primary" id="pBuy" ${medalCount(pr.cur)>=pr.cost?'':'disabled'}>${medalCount(pr.cur)>=pr.cost?'Buy':'Not enough'}</button>
      <button class="btn btn-ghost" id="pCancel" style="margin-top:8px;">Cancel</button>
    </div>`);
  const close = ()=>{ if(ov.parentNode) document.body.removeChild(ov); };
  ov.querySelector('#pCancel').addEventListener('click', close);
  ov.querySelector('#pBuy').addEventListener('click', async ()=>{
    if(medalCount(pr.cur) < pr.cost) return;
    const snapshot = { tokens:state.inventory.tokens, protein:state.inventory.protein, medals:Object.assign({},state.medals), stones:state.moveStones.length };
    await spend(pr.cur, pr.cost);
    let stone = null;
    if(w.id==='randomStone'){ stone = newMoveStone(); state.moveStones.push(stone); }
    else if(w.id==='eliteStone'){ stone = newEliteStone(); state.moveStones.push(stone); }
    else if(w.id==='protein'){ state.inventory.protein = (state.inventory.protein||0)+1; }
    else if(w.id==='crown'){ state.inventory.crowns = (state.inventory.crowns||0)+1; }
    const sv = showSyncingOverlay('Syncing…');
    const ok = await saveProfile({ awaitCloud:true });
    hideSyncingOverlay(sv);
    if(!ok){
      state.inventory.tokens = snapshot.tokens; state.inventory.protein = snapshot.protein;
      state.medals = snapshot.medals; state.moveStones.length = snapshot.stones;
      showSyncFailure(); return;
    }
    close();
    if(stone) showStoneReveal(stone, 'Purchased!', 'shop');
    else if(w.id==='crown'){ playSfx('evolution'); ui.shopNote='A Crown is yours. Use it from a monster\'s Stats page.'; renderShop(); }
    else { playSfx('protein_use'); toast('Protein Supplement purchased!'); renderShop(); }
  });
}

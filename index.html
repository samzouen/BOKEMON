/* Sprite lookup with a three-step fallback chain, so art can be added piecemeal:
     1. assets/mon/<species>_back.png   (player side — rear view, facing away)
        assets/mon/<species>_front.png  (enemy side — facing the player)
     2. assets/mon/<species>.png        (generic, used everywhere else)
     3. the coloured placeholder tile   (nothing uploaded yet)
   `view` is 'back' | 'front' | 'icon'. `breathe` is 'normal' | 'weak' | null. */
function monPortrait(species, size, opts){
  opts = opts || {};
  const s = SPECIES[species];
  const px = size||76;
  const view = opts.view || 'icon';
  const stage = opts.stage || 0;              // 0 = base form, 1 = first evolution, 2 = second
  const radius = Math.round(px*0.21);
  const cls = 'mon-portrait mon-sprite' + (opts.breathe ? ' breathe-'+opts.breathe : '');
  const override = (typeof ASSETS!=='undefined' && ASSETS.sprites)
    ? (ASSETS.sprites[spriteKey(species,stage)+'_'+view] || ASSETS.sprites[spriteKey(species,stage)]) : null;
  const primary = override || spritePath(species, stage, view);
  const bg = opts.bare ? 'transparent' : s.color;
  return `<img src="${primary}" alt="${escapeHtml(s.name)}" class="${cls}"
    data-species="${species}" data-px="${px}" data-view="${view}" data-stage-n="${stage}" data-try="0"
    style="width:${px}px;height:${px}px;border-radius:${radius}px;object-fit:contain;background:${bg};"
    onerror="spriteFallback(this)">`;
}

/* Evolution stages get a number appended to the species id:
     water_starter        base form
     water_starter1       first evolution
     water_starter2       second evolution
   combined with the view suffix, e.g. water_starter1_front.png */
function spriteKey(species, stage){ return species + (stage ? String(stage) : ''); }
function spritePath(species, stage, view){
  const key = spriteKey(species, stage);
  return 'assets/mon/' + key + (view && view!=='icon' ? '_'+view : '') + '.png';
}
/* Convenience: the sprite stage a given owned monster is currently at. */
function monStage(m){ return evolutionStage(m.species, m.level); }

/* Fallback ladder, tried in order until one loads:
     stage+view  ->  stage generic  ->  lower stage+view  ->  ... ->  base
     ->  coloured placeholder tile
   So an unevolved sprite stands in for a missing evolved one rather than
   breaking, and art can be added one stage at a time. */
function spriteFallback(img){
  try{
    const species = img.dataset.species;
    const view = img.dataset.view || 'icon';
    let stage = +(img.dataset.stageN||0);
    let attempt = +(img.dataset.try||0);

    const chain = [];
    for(let st = stage; st >= 0; st--){
      if(view !== 'icon') chain.push(spritePath(species, st, view));
      chain.push(spritePath(species, st, 'icon'));
    }
    attempt++;
    img.dataset.try = String(attempt);
    if(attempt < chain.length){ img.src = chain[attempt]; return; }
    img.outerHTML = monPortraitFallback(species, +img.dataset.px);
  }catch(e){}
}
function monPortraitFallback(species, px){
  const s = SPECIES[species];
  if(!s) return '';
  const fs = Math.round(px*0.4);
  const radius = Math.round(px*0.21);
  return `<div class="mon-portrait" style="width:${px}px;height:${px}px;background:${s.color};font-size:${fs}px;border-radius:${radius}px;">${s.glyph}</div>`;
}

/* NPC trainer portraits: assets/npc/<id>.png, falling back to the emoji badge. */
function npcPortrait(npcId, emoji, size, bg){
  const px = size||50;
  if(!npcId) return `<div class="cc-emoji" style="background:${bg||'var(--paper-3)'};width:${px}px;height:${px}px;font-size:${Math.round(px*0.52)}px;">${emoji||'❓'}</div>`;
  return `<img src="assets/npc/${npcId}.png" alt="" class="npc-portrait"
    data-emoji="${escapeHtml(emoji||'❓')}" data-px="${px}" data-bg="${bg||'var(--paper-3)'}"
    style="width:${px}px;height:${px}px;border-radius:13px;object-fit:contain;background:${bg||'var(--paper-3)'};"
    onerror="npcFallback(this)">`;
}
function npcFallback(img){
  try{
    const px = +img.dataset.px, emoji = img.dataset.emoji, bg = img.dataset.bg;
    img.outerHTML = `<div class="cc-emoji" style="background:${bg};width:${px}px;height:${px}px;font-size:${Math.round(px*0.52)}px;">${emoji}</div>`;
  }catch(e){}
}
function typeBadges(species){
  return SPECIES[species].types.map(t =>
    `<span class="type-badge" style="background:${TYPE_COLORS[t]||'#888'}">${t}</span>`
  ).join(' ');
}
function displayName(mon){
  return mon.nickname || SPECIES[mon.species].name;
}

/* ---------- WORD LIST MODULE ----------
   THREE layers combine into the shared family vocabulary:
     1. remoteWords  — fetched from words.txt (editable on GitHub, syncs to all
                       devices). Falls back to the last synced copy, then to the
                       bundled DEFAULT_MASTER_WORDS.
     2. localWords   — phrases added in-app on this device.
     3. hiddenWords  — phrases deleted in-app (so a remote word can be hidden
                       without editing GitHub).
   masterWords = (remote + local) - hidden, deduped, order preserved.

   The WORDS are shared by everyone on the device. Which words are switched on
   for a given son — his Priority/Regular checkmarks — lives on HIS profile
   (state.wordFlags), so the family studies one list but each child marks it up
   independently. */
const REMOTE_CACHE_KEY = 'wc_remote_words';
const LISTS_CACHE_KEY  = 'wc_lists_cache';
const LOCAL_WORDS_KEY  = 'wc_local_words';
const HIDDEN_WORDS_KEY = 'wc_hidden_words';

/* Multiple word-list files live in words/, one per level+set, e.g.
     words/K1_01.txt   words/P1_01.txt   words/P2_03.txt
   words/lists.txt is a manifest naming them (the browser can't list a folder):
     P1_01.txt | Primary 1 · Set 1
   Each profile chooses which lists apply to that child, so an older sibling can
   revise P1 alongside P2 while the younger one only sees K1. */
const WORDS_DIR      = 'words/';
const WORDS_MANIFEST = 'words/lists.txt';

let availableLists = [];   // [{key,file,label,level}]
let listWords      = {};   // key -> [words]
let remoteWords    = [];   // union of the lists this profile has selected
let localWords     = [];
let hiddenWords    = [];
let masterWords    = [];
let wordSyncNote   = '';

function selectedListKeys(){
  const sel = state?.settings?.wordLists;
  if(!Array.isArray(sel)) return availableLists.map(l=>l.key);   // default: everything
  return sel;
}
function levelOf(key){ const m = String(key).match(/^([A-Za-z]+\d*)/); return m ? m[1].toUpperCase() : 'OTHER'; }

function rebuildRemote(){
  const keys = selectedListKeys();
  const seen = new Set();
  remoteWords = [];
  keys.forEach(k=>{
    (listWords[k]||[]).forEach(w=>{ if(w && !seen.has(w)){ seen.add(w); remoteWords.push(w); } });
  });
  rebuildMaster();
}
function rebuildMaster(){
  const hidden = new Set(hiddenWords);
  const seen = new Set();
  masterWords = [];
  [...remoteWords, ...localWords].forEach(w=>{
    if(!w || hidden.has(w) || seen.has(w)) return;
    seen.add(w); masterWords.push(w);
  });
}

async function loadWordlist(){
  try{ const r = await store.get(LOCAL_WORDS_KEY);  localWords  = r ? JSON.parse(r.value) : []; }catch(e){ localWords  = []; }
  try{ const r = await store.get(HIDDEN_WORDS_KEY); hiddenWords = r ? JSON.parse(r.value) : []; }catch(e){ hiddenWords = []; }
  try{
    const r = await store.get(LISTS_CACHE_KEY);
    if(r){ const c = JSON.parse(r.value); availableLists = c.lists||[]; listWords = c.words||{}; }
  }catch(e){}

  if(availableLists.length === 0 && Object.keys(listWords).length === 0){
    // nothing cached yet — fall back to the bundled list so play can start
    availableLists = [{ key:'builtin', file:null, label:'Built-in starter list', level:'BUILT-IN' }];
    listWords = { builtin: DEFAULT_MASTER_WORDS.slice() };
  }
  rebuildRemote();
  syncRemoteWords();
}

/* Fetch the manifest, then every list it names. Falls back to the older
   single words.txt, then to the bundled list. Never blocks play. */
async function syncRemoteWords(){
  const notALIst = t => /<\s*html/i.test(t);
  try{
    const res = await fetch(WORDS_MANIFEST, { cache:'no-store' });
    if(!res.ok) throw new Error('no manifest');
    const text = await res.text();
    if(notALIst(text)) throw new Error('404 page');
    const entries = text.split('\n').map(l=>l.trim()).filter(l=>l && !l.startsWith('#')).map(line=>{
      const [fileRaw, labelRaw] = line.split('|').map(x=>(x||'').trim());
      const file = fileRaw;
      const key  = file.replace(/\.txt$/i,'');
      return { key, file, label: labelRaw || key, level: levelOf(key) };
    });
    if(entries.length===0) throw new Error('empty manifest');

    const fetched = {};
    for(const e of entries){
      try{
        const r = await fetch(WORDS_DIR + e.file, { cache:'no-store' });
        if(!r.ok) continue;
        const t = await r.text();
        if(notALIst(t)) continue;
        const words = t.split('\n').map(x=>x.trim()).filter(Boolean);
        if(words.length) fetched[e.key] = words;
      }catch(err){}
    }
    const got = entries.filter(e=>fetched[e.key]);
    if(got.length===0) throw new Error('no lists loaded');

    availableLists = got;
    listWords = fetched;
    await store.set(LISTS_CACHE_KEY, JSON.stringify({ lists:availableLists, words:listWords }));
    rebuildRemote();
    const total = new Set(Object.values(fetched).flat()).size;
    wordSyncNote = `Synced ${got.length} list${got.length===1?'':'s'} · ${total} words`;
  }catch(e){
    // legacy single-file mode
    try{
      const r = await fetch('words.txt', { cache:'no-store' });
      if(r.ok){
        const t = await r.text();
        if(!notALIst(t)){
          const words = t.split('\n').map(x=>x.trim()).filter(Boolean);
          if(words.length){
            availableLists = [{ key:'words', file:'words.txt', label:'Word list', level:'ALL' }];
            listWords = { words };
            await store.set(LISTS_CACHE_KEY, JSON.stringify({ lists:availableLists, words:listWords }));
            rebuildRemote();
            wordSyncNote = `Synced ${words.length} words from words.txt`;
            if(ui.screen==='spelling' && ui.spellingUnlocked) renderSpellingManage();
            if(ui.screen==='spellingIndex') renderSpellingIndex();
            return;
          }
        }
      }
    }catch(err){}
    if(remoteWords.length===0){
      availableLists = [{ key:'builtin', file:null, label:'Built-in starter list', level:'BUILT-IN' }];
      listWords = { builtin: DEFAULT_MASTER_WORDS.slice() };
      rebuildRemote();
    }
    wordSyncNote = 'Using the built-in list (words/ not reachable)';
  }
  if(ui.screen==='spelling' && ui.spellingUnlocked) renderSpellingManage();
  if(ui.screen==='spellingIndex') renderSpellingIndex();
}

async function saveWordlist(){
  try{
    await store.set(LOCAL_WORDS_KEY,  JSON.stringify(localWords));
    await store.set(HIDDEN_WORDS_KEY, JSON.stringify(hiddenWords));
  }catch(e){}
  rebuildMaster();
}

function addWords(lines){
  const existing = new Set(masterWords);
  const added = [], skipped = [];
  lines.forEach(t=>{
    if(existing.has(t) || added.includes(t)) skipped.push(t);
    else added.push(t);
  });
  added.forEach(t=>{
    hiddenWords = hiddenWords.filter(h=>h!==t);   // un-hide if it was deleted before
    if(!localWords.includes(t) && !remoteWords.includes(t)) localWords.push(t);
  });
  rebuildMaster();
  return { added:added.length, skipped:skipped.length };
}

function removeWord(text){
  localWords = localWords.filter(w=>w!==text);
  if(remoteWords.includes(text) && !hiddenWords.includes(text)) hiddenWords.push(text);
  rebuildMaster();
}

/* ---- per-profile checkmarks over the shared list ----
   No stored entry = default {priority:false, regular:true}, so a word newly
   added to words.txt is automatically active for every son. */
function wordFlags(text){
  const f = state && state.wordFlags && state.wordFlags[text];
  return f ? { priority:!!f.priority, regular:f.regular!==false } : { priority:false, regular:true };
}
function setWordFlag(text, key, value){
  if(!state) return;
  state.wordFlags = state.wordFlags || {};
  const cur = state.wordFlags[text] || { priority:false, regular:true };
  cur[key] = value;
  state.wordFlags[text] = cur;
}
function wordRows(){
  return masterWords.map(text => {
    const f = wordFlags(text);
    return { text, priority:f.priority, regular:f.regular, isRemote: remoteWords.includes(text) };
  });
}
function activePool(){
  const rows = wordRows();
  if(state?.settings?.focusMode) return rows.filter(w=>w.priority);
  return rows.filter(w=>w.priority || w.regular);
}
function definitionFor(text){
  return CEDICT[text] || null;
}


/* ---------- WORD MASTERY & MILESTONE REWARDS ----------
   Every time a phrase is completed in a SCORED context (battle, catch, recovery)
   its mastery count ticks up. Practice mode never counts — that keeps practice a
   safe place to learn without it becoming the efficient way to farm rewards.

   Checkpoints per phrase: 15 and 40 completions.
   Rewards are paid per TEN phrases reaching a checkpoint:
     - every 10 phrases at 15+  ->  1 Protein Supplement
     - every 10 phrases at 40+  ->  1 Elite Skill Token
   `masteryAwarded` remembers how many milestones have already paid out, so
   rewards are never granted twice. */
/* Three mastery tiers, each paying a medal per TEN words that reach it:
     5 completions  -> Bronze   (rename a monster · 3 = 1 Skill Token)
    15 completions  -> Silver   (10 = 1 Protein Supplement)
    25 completions  -> Gold     (elite stones and hand-picked skills)
   Medals are spent in the Shop, so a long grind converts into a deliberate
   choice rather than a random drop. */
const MASTERY_CHECKPOINTS = { bronze:5, silver:15, gold:25 };
/* EVERY tier pays one medal PER WORD that reaches its threshold. Grouping by
   ten made the cheap currency cost more practice than the premium one — a
   bronze medal would have taken 10 words x 5 reps = 50 practices, against 25
   for a gold. Per-word keeps the ladder honest: 5 / 15 / 25 reps per medal.

   Tiers are CUMULATIVE: a word at 25 reps has also passed 15 and 5, so it pays
   a bronze, a silver AND a gold. */
const MASTERY_GROUP_BY_TIER = { bronze:1, silver:1, gold:1 };
const MASTERY_GROUP = 1;

function masteryOf(text){ return (state.wordMastery && state.wordMastery[text]) || 0; }
function masteryTier(n){
  if(n >= MASTERY_CHECKPOINTS.gold)   return 'gold';
  if(n >= MASTERY_CHECKPOINTS.silver) return 'silver';
  if(n >= MASTERY_CHECKPOINTS.bronze) return 'bronze';
  return null;
}
function masteryCounts(){
  const vals = Object.values(state.wordMastery || {});
  return {
    bronze: vals.filter(v=>v>=MASTERY_CHECKPOINTS.bronze).length,
    silver: vals.filter(v=>v>=MASTERY_CHECKPOINTS.silver).length,
    gold:   vals.filter(v=>v>=MASTERY_CHECKPOINTS.gold).length,
  };
}

function recordMastery(text){
  if(!state) return null;
  state.wordMastery = state.wordMastery || {};
  state.wordMastery[text] = (state.wordMastery[text] || 0) + 1;
  return checkMasteryRewards();
}
/* Medals are granted as words cross a tier, but progress made BEFORE medals
   existed (or before a tier's threshold changed) would otherwise never pay out.
   This reconciles the ledger against the actual mastery counts on load. */
function reconcileMastery(){
  if(!state || !state.wordMastery) return null;
  const c = masteryCounts();
  let granted = null;
  ['bronze','silver','gold'].forEach(tier=>{
    const owed = Math.floor(c[tier] / MASTERY_GROUP_BY_TIER[tier]);
    const paid = state.masteryAwarded[tier] || 0;
    if(owed > paid){
      const diff = owed - paid;
      state.masteryAwarded[tier] = owed;
      state.medals[tier] = (state.medals[tier]||0) + diff;
      granted = granted || {bronze:0,silver:0,gold:0};
      granted[tier] += diff;
    }
  });
  return granted;
}

function checkMasteryRewards(){
  const c = masteryCounts();
  const rewards = { bronze:0, silver:0, gold:0 };
  ['bronze','silver','gold'].forEach(tier=>{
    const owed = Math.floor(c[tier] / MASTERY_GROUP_BY_TIER[tier]);
    if(owed > (state.masteryAwarded[tier]||0)){
      rewards[tier] = owed - (state.masteryAwarded[tier]||0);
      state.masteryAwarded[tier] = owed;
      state.medals[tier] = (state.medals[tier]||0) + rewards[tier];
    }
  });
  return (rewards.bronze || rewards.silver || rewards.gold) ? rewards : null;
}
function announceMastery(r){
  if(!r) return;
  const bits = [];
  if(r.bronze) bits.push(`${r.bronze} 🥉 Bronze`);
  if(r.silver) bits.push(`${r.silver} 🥈 Silver`);
  if(r.gold)   bits.push(`${r.gold} 🥇 Gold`);
  toast('🏅 Mastery reward: ' + bits.join(' + ') + ' Medal' + ((r.bronze+r.silver+r.gold)>1?'s':'') + '!');
}

/* ---------- ELITE SKILL TOKENS ----------
   5 tokens  -> guaranteed High / Very High / Ultra at 60 / 30 / 10%
   50 tokens -> shop: pick ANY Very High skill stone
   100 tokens-> shop: pick ANY Ultra skill stone */
const ELITE_ROLL_COST = 5;
const ELITE_SHOP_HIGH = 5;
const ELITE_SHOP_VERYHIGH = 50;
const ELITE_SHOP_ULTRA = 100;
const ELITE_ROLL_ODDS = [
  { tier:'veryhigh', odds:0.75 },
  { tier:'ultra',    odds:0.25 },
];
function rollEliteTier(){
  const r = Math.random(); let acc = 0;
  for(const o of ELITE_ROLL_ODDS){ acc += o.odds; if(r < acc) return o.tier; }
  return 'veryhigh';
}
function newEliteStone(){
  const tier = rollEliteTier();
  const type = rollStoneType();
  return { uid:'s'+Date.now()+Math.floor(Math.random()*1000), tier, type, name:stoneName(type,tier) };
}

/* ---------- QUIZ ENGINE ----------
   Reusable across practice / battle / catch / recovery (later phases).
   ui.quiz holds live state. Rules baked in:
   - audio-only prompt (word never shown until resolved)
   - no hints
   - 15s timer per phrase, resets on every CORRECT STROKE (not on mistakes)
   - 5 consecutive mistakes (across the whole word) fails the phrase
   - timeout fails the phrase
   Config: { words:[str], title, subtitle, onComplete(results), onExit() }
   results = [{ text, passed, mistakes, timedOut }] */
const MISTAKE_LIMIT = 5;
const TIMER_SECONDS = 15;
let quizTimer = null;      // single shared interval handle
let quizToken = 0;         // bumped each word; stale intervals self-cancel

function startQuiz(config){
  stopTimer();
  ui.quiz = {
    config,
    index:0,
    results:[],
    writers:[],
    chars:[],
    charIndex:0,
    consecutiveMistakes:0,
    locked:false,
    timeLeft:TIMER_SECONDS,
    token:++quizToken,
    resolved:false,
    wordsDone: config.startingWords || 0,   // carry-over spill from the previous move
  };
  ui.screen = 'quiz';
  render();
}

/* ---------- MANDARIN VOICE SELECTION ----------
   Two bugs previously caused the prompt to drift into Cantonese mid-session:
   (1) matching lang.startsWith('zh') also matches zh-HK / yue (Cantonese) and
       zh-TW, and (2) speechSynthesis.getVoices() fills in asynchronously, so the
       list can reorder between calls and a plain .find() picks a different voice
       later on. We now match Mandarin explicitly, reject Cantonese outright, and
       CACHE the resolved voice so it can never change mid-session. */
let _mandarinVoice = null;
let _voiceResolved = false;

function isCantonese(v){
  const t = ((v.lang||'') + ' ' + (v.name||'')).toLowerCase();
  return t.includes('yue') || t.includes('hk') || t.includes('hong kong') || t.includes('cantonese');
}
function isMandarin(v){
  const lang = (v.lang||'').toLowerCase().replace('_','-');
  const name = (v.name||'').toLowerCase();
  if(isCantonese(v)) return false;
  return lang.startsWith('zh') || lang.startsWith('cmn') || name.includes('mandarin') || name.includes('putonghua');
}
function pickMandarinVoice(){
  if(_voiceResolved && _mandarinVoice) return _mandarinVoice;
  let voices = [];
  try{ voices = speechSynthesis.getVoices() || []; }catch(e){ return null; }
  if(!voices.length) return null;              // not loaded yet — retry next call
  const candidates = voices.filter(isMandarin);
  if(!candidates.length){ _voiceResolved = true; _mandarinVoice = null; return null; }
  const score = v => {
    const lang = (v.lang||'').toLowerCase().replace('_','-');
    const name = (v.name||'').toLowerCase();
    if(lang === 'zh-cn') return 0;             // mainland Mandarin — best match
    if(lang.startsWith('zh-hans')) return 1;
    if(lang.startsWith('cmn')) return 2;
    if(name.includes('mandarin')) return 3;
    if(lang === 'zh') return 4;
    if(lang.startsWith('zh-tw')) return 6;     // Taiwanese Mandarin — usable, last resort
    return 5;
  };
  candidates.sort((a,b)=>score(a)-score(b));
  _mandarinVoice = candidates[0];
  _voiceResolved = true;
  return _mandarinVoice;
}
// resolve as soon as the voice list is available, and re-resolve if it reloads
try{
  if(typeof speechSynthesis !== 'undefined'){
    speechSynthesis.addEventListener('voiceschanged', ()=>{ _voiceResolved=false; _mandarinVoice=null; pickMandarinVoice(); });
  }
}catch(e){}

function speakWord(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickMandarinVoice();
    if(v) u.voice = v;
    u.lang = 'zh-CN';                          // always Mandarin, never inherited
    u.rate = 0.85;
    u.volume = state?.settings?.volume ?? 0.8;
    // Duck the music while the Chinese prompt plays so it stays clearly audible.
    const restore = ()=>{ if(musicGain && actx) rampGain(musicGain, musicVolume(), 250);
                          else if(audio.musicEl) audio.musicEl.volume = musicVolume(); };
    if(musicGain && actx) rampGain(musicGain, musicVolume()*0.25, 150);
    else if(audio.musicEl) audio.musicEl.volume = musicVolume() * 0.25;
    u.addEventListener('end', restore);
    u.addEventListener('error', restore);
    setTimeout(restore, 6000);   // failsafe if the end event never fires
    speechSynthesis.speak(u);
  }catch(e){}
}

/* Re-fit the writing box when the device rotates or the window resizes. */
let _fitTimer = null;
function refitWriteBox(){
  if(ui.screen !== 'quiz' || !ui.quiz || ui.quiz.resolved) return;
  clearTimeout(_fitTimer);
  _fitTimer = setTimeout(()=>{ if(ui.screen==='quiz' && ui.quiz && !ui.quiz.resolved) initQuizChar(ui.quiz.charIndex); }, 180);
}
let _battleFitTimer = null;
function refitBattle(){
  if(ui.screen !== 'battle' || !ui.battle) return;
  clearTimeout(_battleFitTimer);
  _battleFitTimer = setTimeout(()=>{ if(ui.screen==='battle' && ui.battle) renderBattle(); }, 200);
}
try{
  window.addEventListener('resize', ()=>{ refitWriteBox(); refitBattle(); });
  window.addEventListener('orientationchange', ()=>{ refitWriteBox(); refitBattle(); });
}catch(e){}

function renderMistakeDots(){
  const q = ui.quiz;
  if(q.config.relaxed) return;   // no attempt limit in practice mode
  const el = $('#mistakeDots');
  if(!el) return;
  el.innerHTML = '';
  for(let i=0;i<MISTAKE_LIMIT;i++){
    const d = document.createElement('div');
    d.style.cssText = 'width:9px;height:9px;border-radius:50%;background:'+(i<q.consecutiveMistakes?'var(--cinnabar)':'var(--paper-3)');
    el.appendChild(d);
  }
}

function startTimer(){
  const q = ui.quiz;
  q.timeLeft = TIMER_SECONDS;
  updateTimerBar();
  stopTimer();
  const myToken = q.token;
  quizTimer = setInterval(()=>{
    // if the quiz moved on (new word/quiz) or resolved, this interval is stale — stop it
    if(!ui.quiz || ui.quiz.token !== myToken || ui.quiz.resolved){
      clearInterval(quizTimer); quizTimer = null; return;
    }
    ui.quiz.timeLeft -= 0.1;
    if(ui.quiz.timeLeft <= 0){
      ui.quiz.timeLeft = 0;
      updateTimerBar();
      resolveWord(false, true);
    } else {
      updateTimerBar();
    }
  }, 100);
}
function resetTimer(){ if(ui.quiz) ui.quiz.timeLeft = TIMER_SECONDS; updateTimerBar(); }
function stopTimer(){ if(quizTimer){ clearInterval(quizTimer); quizTimer = null; } }
function updateTimerBar(){
  const q = ui.quiz;
  const fill = $('#timerFill');
  if(!fill || !q) return;
  const pct = Math.max(0,(q.timeLeft/TIMER_SECONDS)*100);
  fill.style.width = pct+'%';
  fill.style.background = pct < 33 ? 'var(--cinnabar)' : (pct < 66 ? 'var(--gold)' : 'var(--jade)');
}

function writeBoxSize(){
  // Measure the WRAPPER (a plain block element that lays out immediately) rather
  // than the box itself — the box's own size depends on the value we're about to
  // compute, so measuring it produced a smaller reading on the very first render.
  const wrap = $('#charsRow');
  const rect = wrap ? wrap.getBoundingClientRect() : null;
  const byWidth  = rect && rect.width > 0 ? rect.width : Math.min(window.innerWidth - 32, 420);
  const top      = rect ? rect.top : 260;
  const byHeight = window.innerHeight - top - 70;   // room for the status line
  return Math.max(220, Math.floor(Math.min(byWidth, byHeight)));
}

function renderCharProgress(){
  const q = ui.quiz;
  const el = $('#charProgress');
  if(!el) return;
  el.innerHTML = q.chars.map((ch,i)=>{
    const state = i < q.charIndex ? 'done' : (i === q.charIndex ? 'now' : 'todo');
    return `<span class="char-pip ${state}">${state==='done' ? escapeHtml(ch) : (state==='now' ? '✍️' : '•')}</span>`;
  }).join('');
}

function initQuizChar(i){
  const q = ui.quiz;
  q.charIndex = i;
  renderCharProgress();
  const box = $('#qbox-0');
  if(box) box.innerHTML = '';                 // reuse the one big box for each character
  // Wait for layout before measuring. Without this the FIRST character of a
  // phrase was sized from an unsettled layout (~2/3 size), which threw off
  // stroke recognition; later characters measured correctly.
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(!ui.quiz || ui.quiz.token !== q.token) return;   // moved on already
    buildWriter(i, box);
  }));
}

function buildWriter(i, box){
  const q = ui.quiz;
  const size = writeBoxSize();
  if(box){ box.style.width = size+'px'; box.style.height = size+'px'; }
  // Practice ("relaxed") mode is a low-pressure learning space: no timer, no
  // attempt cap, and Hanzi Writer's own hint appears after 3 misses on a stroke.
  // Battle / catch / recovery keep the strict rules — no hints there, ever.
  const hintAfter = q.config.relaxed ? (q.config.hintAfterMisses || 3) : false;
  const writer = HanziWriter.create(box, q.chars[i], {
    width:size, height:size, padding:Math.round(size*0.05),
    showCharacter:false, showOutline:false, showHintAfterMisses:false,
    strokeColor:'#232019', drawingColor:'#232019', drawingWidth:Math.max(24, Math.round(size*0.075)),
    highlightColor:'#c8453a',
  });
  q.writers[i] = writer;
  writer.quiz({
    showHintAfterMisses: hintAfter,
    onMistake:function(strokeData){
      if(q.locked) return;
      q.consecutiveMistakes++;
      q.wordMistakes = (q.wordMistakes||0) + 1;
      renderMistakeDots();
      if(!q.config.relaxed && q.consecutiveMistakes >= MISTAKE_LIMIT){ resolveWord(false,false); return; }
      const st=$('#quizStatus');
      if(st){
        const misses = (strokeData && strokeData.mistakesOnStroke) || q.consecutiveMistakes;
        st.textContent = (q.config.relaxed && misses >= hintAfter)
          ? 'Watch the highlighted stroke, then try it.'
          : 'Try that stroke again.';
        st.style.color='var(--cinnabar)';
      }
    },
    onCorrectStroke:function(){
      if(q.locked) return;
      q.consecutiveMistakes = 0;
      renderMistakeDots();
      if(!q.config.relaxed) resetTimer();
      const st=$('#quizStatus'); if(st){ st.textContent=''; }
    },
    onComplete:function(){
      if(q.locked) return;
      if(i+1 < q.chars.length){
        // brief green flash, then the same big box takes the next character
        if(box) box.classList.add('char-done');
        setTimeout(()=>{
          if(box) box.classList.remove('char-done');
          initQuizChar(i+1);
        }, 280);
      } else {
        if(box) box.classList.add('char-done');
        resolveWord(true,false);
      }
    }
  });
}

function resolveWord(passed, timedOut){
  const q = ui.quiz;
  if(q.resolved) return;
  q.resolved = true;
  q.locked = true;
  stopTimer();
  const word = q.config.words[q.index];
  // A practice word can't "fail" (unlimited tries), but one that took several
  // attempts should still surface first in Recovery later.
  if(!passed || (q.config.relaxed && (q.wordMistakes||0) >= 3)) recordWrong(word);
  // Mastery only accrues in SCORED contexts — practice deliberately doesn't count.
  if(passed && !q.config.relaxed){
    q.masteryReward = recordMastery(word) || q.masteryReward;
    saveProfile();
  }
  playSfx(passed ? 'answer_correct' : 'answer_wrong');
  if(passed) q.wordsDone = (q.wordsDone||0) + countWords(word);
  q.results.push({ text:word, passed, mistakes:q.wordMistakes||0, timedOut, words:countWords(word) });

  const st = $('#quizStatus');
  const rb = $('#quizResult');
  if(st) st.textContent = '';
  if(rb){
    rb.innerHTML = `
      <div style="text-align:center;margin-top:10px;padding:14px;border-radius:12px;background:${passed?'rgba(47,143,111,0.12)':'rgba(200,69,58,0.09)'};border:1px solid ${passed?'rgba(47,143,111,0.35)':'rgba(200,69,58,0.3)'};">
        <div style="font-family:'Baloo 2',cursive;font-weight:800;font-size:18px;color:${passed?'var(--jade-dark)':'var(--cinnabar-dark)'};">
          ${passed?'✓ Correct!':(timedOut?'⏱ Out of time':'✗ Not quite')}
        </div>
        <div style="font-family:'Noto Sans SC';font-size:26px;font-weight:700;margin-top:4px;">${escapeHtml(word)}</div>
        <div style="font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:2px;">${escapeHtml(definitionFor(word)||'')}</div>
        ${(passed && !q.config.relaxed) ? masteryChip(word) : ''}
      </div>
      <button class="btn btn-primary" id="quizNext" style="margin-top:12px;">${quizWillEnd(passed) ? 'Continue' : 'Next word'}</button>
    `;
    $('#quizNext').addEventListener('click', advanceQuiz);
  }
}

function quizWillEnd(passed){
  const q = ui.quiz;
  if(q.index+1 >= q.config.words.length) return true;
  if(q.config.stopAtFirstMiss && !passed) return true;
  return false;
}

function medalIcon(tier){ return tier==='gold'?'🥇':(tier==='silver'?'🥈':(tier==='bronze'?'🥉':'📈')); }
function masteryChip(word){
  const n = masteryOf(word);
  const tier = masteryTier(n);
  const next = n < MASTERY_CHECKPOINTS.bronze ? MASTERY_CHECKPOINTS.bronze
             : (n < MASTERY_CHECKPOINTS.silver ? MASTERY_CHECKPOINTS.silver
             : (n < MASTERY_CHECKPOINTS.gold ? MASTERY_CHECKPOINTS.gold : null));
  const label = next ? `${medalIcon(tier)} mastery ${n} / ${next}` : `🥇 mastered ×${n}`;
  return `<div style="font-size:11px;color:var(--ink-soft);font-weight:800;margin-top:6px;">${label}</div>`;
}

function advanceQuiz(){
  const q = ui.quiz;
  if(q.masteryReward){ announceMastery(q.masteryReward); q.masteryReward = null; }
  const last = q.results[q.results.length-1];
  if(q.config.stopAtFirstMiss && last && !last.passed){
    stopTimer(); if(q.config.onComplete) q.config.onComplete(q.results); return;
  }
  if(q.config.endAfterMistakes){
    const misses = q.results.filter(r=>!r.passed).length;
    if(misses >= q.config.endAfterMistakes){
      stopTimer(); if(q.config.onComplete) q.config.onComplete(q.results); return;
    }
  }
  // Word-powered moves finish the moment the target is met or exceeded — the
  // overshoot from a long final phrase is handed to the next move as spill.
  if(q.config.wordTarget && q.wordsDone >= q.config.wordTarget){
    stopTimer(); if(q.config.onComplete) q.config.onComplete(q.results); return;
  }
  q.index++;
  if(q.index < q.config.words.length){ renderQuiz(); }
  else { stopTimer(); if(q.config.onComplete) q.config.onComplete(q.results); }
}


/* ---------- TYPE EFFECTIVENESS ----------
   Three standard triangles (effective 2x forward, 0.5x backward) + Fantasy triangle
   (2x forward, neutral backward; each fantasy type resists one whole standard triangle).
   Dual-type: evaluated once, no 4x stacking; effective+ineffective cancels to neutral. */
const TRIANGLES = {
  starter:['Water','Fire','Grass'],
  sky:['Electric','Flying','Ground'],
  mind:['Psychic','Ghost','Physical'],
  fantasy:['Dragon','Steel','Fairy'],
};
const FANTASY_RESIST = { Dragon:'starter', Steel:'sky', Fairy:'mind' };

function pairEffect(atk, def){
  for(const ft in FANTASY_RESIST){
    if(def===ft && TRIANGLES[FANTASY_RESIST[ft]].includes(atk)) return 0.5;
  }
  for(const key of ['starter','sky','mind']){
    const t = TRIANGLES[key];
    const ai=t.indexOf(atk), di=t.indexOf(def);
    if(ai>=0 && di>=0){
      if((ai+1)%3===di) return 2;
      if((di+1)%3===ai) return 0.5;
      return 1;
    }
  }
  const f = TRIANGLES.fantasy;
  const ai=f.indexOf(atk), di=f.indexOf(def);
  if(ai>=0 && di>=0){ if((ai+1)%3===di) return 2; return 1; }
  return 1;
}
function typeMultiplier(atkTypes, defTypes){
  let eff=false, weak=false;
  atkTypes.forEach(a=> defTypes.forEach(d=>{
    const r = pairEffect(a,d);
    if(r>1) eff=true; else if(r<1) weak=true;
  }));
  if(eff && weak) return 1;
  if(eff) return 1.5;    // super effective: 1.5x damage dealt
  if(weak) return 0.67;  // resisted: 0.67x damage received
  return 1;
}
function effectivenessLabel(mult){
  if(mult>1) return 'Super effective!';
  if(mult<1) return 'Not very effective…';
  return '';
}

/* ---------- MOVE RESOLUTION (universal fail-tier formula) ---------- */
/* Fail tiers, now measured in WORDS. Each old phrase-step is two words, so the
   shape of the curve is preserved: Power1 drops a tier at n-2 words, and
   Power2/Ultimate at n-2 then n-4. */
function moveFactor(slot, baseMult, words, correct){
  if(baseMult==null) return 0;
  const n = words;
  if(slot==='Basic') return correct>=n ? baseMult : 0;
  if(slot==='Power1'){
    if(correct>=n)   return baseMult;
    if(correct>=n-2) return baseMult*0.2;   // 1/5 one "phrase-step" short
    return 0;
  }
  if(correct>=n)   return baseMult;
  if(correct>=n-2) return baseMult*0.5;
  if(correct>=n-4) return baseMult*0.2;
  return 0;
}

/* ---------- STATUS EFFECT ENGINE ----------
   Player statuses: keyed by monster uid on ui.battle.playerStatuses, so they
   persist through switches and faint/revive, cleared only at battle end.
   Enemy statuses: attached directly to the enemy object (enemies are recreated
   fresh each wave, so this naturally resets between waves).
   Party-wide: ui.battle.mirageActive. */
function getPStatus(uid, type){ return (ui.battle.playerStatuses[uid]||[]).find(s=>s.type===type); }
function setPStatus(uid, status){
  const arr = ui.battle.playerStatuses[uid] = ui.battle.playerStatuses[uid] || [];
  const i = arr.findIndex(s=>s.type===status.type);
  if(i>=0) arr[i]=status; else arr.push(status);
}
function clearPStatus(uid, type){
  const arr = ui.battle.playerStatuses[uid];
  if(!arr) return;
  const i = arr.findIndex(s=>s.type===type);
  if(i>=0) arr.splice(i,1);
}

/* Enemy statuses STACK: each enemy carries a list, not a single slot.
   Re-applying the same type refreshes it rather than adding a duplicate. */
function eStatuses(e){ if(!Array.isArray(e.statuses)) e.statuses = []; return e.statuses; }
function getEStatus(e, type){ return eStatuses(e).find(s=>s.type===type); }
function addEStatus(e, status){
  const arr = eStatuses(e);
  const i = arr.findIndex(s=>s.type===status.type);
  if(i>=0) arr[i] = status; else arr.push(status);
}
function removeEStatus(e, type){
  const arr = eStatuses(e);
  const i = arr.findIndex(s=>s.type===type);
  if(i>=0) arr.splice(i,1);
}

/* Battle reference for a player monster: computeDamage needs BOTH .types (for
   effectiveness) and .uid (for status lookup). Passing the raw monster object
   fails because monsters store species, not types. */
function monRef(m){ return { uid:m.uid, types:SPECIES[m.species].types, species:m.species }; }

/* Unified damage calc: applies type effectiveness + all status modifiers, in a
   fixed order, then rounds up. `attacker`/`defender` are refs — use monRef() for
   player monsters; enemy objects already carry .types. */
function computeDamage(baseFactor, attackerAtk, attacker, defender, isPlayerAttacking){
  let dmg = baseFactor * attackerAtk;
  dmg *= typeMultiplier(attacker.types, defender.types);

  // attacker-side buffs/debuffs
  if(isPlayerAttacking){
    const oh = getPStatus(attacker.uid,'overheat'); if(oh) dmg *= 1.5;               // deals 1.5x
  } else {
    if(getEStatus(attacker,'discombobulate')) dmg *= 0.8;   // enemy deals 20% less
  }

  // defender-side modifiers
  if(isPlayerAttacking){ // defender is an enemy
    if(getEStatus(defender,'iceTomb')) dmg *= 0.5;    // entombed takes half
    if(getEStatus(defender,'curse'))   dmg *= 1.25;   // cursed takes 25% more
  } else { // defender is a player monster
    const oh = getPStatus(defender.uid,'overheat'); if(oh) dmg *= 1.5;               // takes 1.5x (incl. self-dmg)
    const sa = getPStatus(defender.uid,'spikeArmour'); if(sa) dmg *= 0.8;            // takes 20% less
  }
  return Math.max(0, Math.ceil(dmg));
}

/* Apply a Very High status move. Returns {msg, directDamage:[{idx,dmg}] } for UI. */
function applyVeryHighEffect(type, casterMon, casterAtk, targets){
  const uid = casterMon.uid;
  const res = { msg:'', hits:[] };
  switch(type){
    case 'Fire': // Overheat: self buff, no direct damage
      setPStatus(uid,{type:'overheat'});
      res.msg = `${displayName(casterMon)} overheats! +50% damage dealt, but +50% damage taken for the rest of the battle.`;
      break;
    case 'Water': { // Ice Tomb: freeze one enemy 3-5 turns, 45/35/20
      const t = targets[0];
      const r = Math.random(); const turns = r<0.45?3:(r<0.80?4:5);
      if(t) addEStatus(t, { type:'iceTomb', turnsLeft:turns });
      res.msg = `The enemy is entombed in ice for ${turns} turns! It takes only half damage while frozen.`;
      break; }
    case 'Grass': { // Giga Drain: mark + one hit for 0.5x
      const t = targets[0];
      if(t){
        const dmg = Math.ceil(0.5*casterAtk*typeMultiplier(SPECIES[casterMon.species].types, t.types));
        res.hits.push({ enemy:t, dmg });
        addEStatus(t, { type:'gigaDrainMark' });
      }
      res.msg = `Giga Drain marks the target — any hit on it now heals the attacker!`;
      break; }
    case 'Electric': // Overcharge: self buff, 25% repeat chance
      setPStatus(uid,{type:'overcharge', chance:0.25});
      res.msg = `${displayName(casterMon)} is overcharged! 25% chance to repeat an attack for the rest of the battle.`;
      break;
    case 'Ground': // Spike Armour: self buff
      setPStatus(uid,{type:'spikeArmour'});
      res.msg = `${displayName(casterMon)} grows spikes! Takes 20% less damage and reflects 0.4x ATK on hit.`;
      break;
    case 'Flying': // Mirage: party-wide evasion
      ui.battle.mirageActive = true;
      res.msg = `A mirage surrounds your whole team! 20% chance to evade any attack for the rest of the battle.`;
      break;
    case 'Physical': // Counter: self buff, one-shot
      setPStatus(uid,{type:'counter'});
      res.msg = `${displayName(casterMon)} braces to counter the next hit!`;
      break;
    case 'Ghost': { // Curse: enemy debuff, +25% damage taken
      const t = targets[0];
      if(t) addEStatus(t, { type:'curse' });
      res.msg = `The enemy is cursed! It now takes 25% more damage.`;
      break; }
    case 'Psychic': { // Discombobulate: enemy debuff, -20% damage dealt
      const t = targets[0];
      if(t) addEStatus(t, { type:'discombobulate' });
      res.msg = `The enemy is discombobulated! It now deals 20% less damage.`;
      break; }
    default:
      res.msg = 'Nothing happened.';
  }
  return res;
}

/* ---------- BATTLE MODULE (Phase 3: wild encounters) ---------- */
function starterLevel(){
  const st = state.party.find(m=>m.species===state.starterSpecies);
  return st ? st.level : (state.party[0]?state.party[0].level:5);
}
function wildLevel(){
  const L = starterLevel();
  return Math.min(20, Math.max(5, Math.floor(L/5)*5));
}
function wildGroupSize(){
  const L = starterLevel();
  if(L>=21 && Math.random()<0.10) return 3;
  if(L>=12 && Math.random()<0.30) return 2;
  return 1;
}
const REGION1_WILD = ['rat','bird','moth'];

/* Explorable zones per region. `id` drives the button art at
   assets/zones/<id>.png; `tint` colours the bevel if no art is present. */
const REGION_ZONES = {
  1: [ { id:'tranquil_forest', name:'Tranquil Forest', tint:'#4a7a3c' } ],
};

function makeEnemy(species, level, opts){
  opts = opts || {};
  const sp = SPECIES[species];
  const nerfed = (opts.nerfed!==undefined) ? opts.nerfed : (sp.tier==='wild');
  const rate = nerfed ? sp.nerfedRate : sp.rate;
  const stage = (sp.evo||[]).filter(lv=>level>=lv).length;
  let stat = Math.floor((rate/5)*level) + stage*rate;
  // AI: 'basic' | 'power1' | 'best'. Default: wild=basic, but electric/legendary open with Power1.
  let ai = opts.ai || ((species==='electric_starter' || sp.tier==='legendary') ? 'power1' : 'basic');
  const avail = MOVES[species].filter(m=>m[1]!=null && level>=m[5] && m[2]!=null); // damaging + unlocked
  const bySlot = s=> avail.find(m=>m[0]===s);
  let move;
  if(ai==='best') move = bySlot('Power2') || bySlot('Power1') || bySlot('Basic');
  else if(ai==='power1') move = bySlot('Power1') || bySlot('Basic');
  else move = bySlot('Basic');
  if(!move) move = avail[0] || MOVES[species][0];
  return { species, level, maxHp:stat, hp:stat, atk:stat, move, types:sp.types, stage, tier:sp.tier, ai, nerfed };
}

function startWildEncounter(encOpts){
  encOpts = encOpts || {};
  const pool = activePool();
  if(pool.length===0){ ui.prevScreen='region'; toast('No words selected, please select to proceed.'); go('spelling'); return; }
  const L = starterLevel();
  let special = null;
  if(L>=20){ const r=Math.random(); if(r<0.05) special='phoenix'; else if(r<0.20) special='electric_starter'; }
  let wave;
  if(special){
    const lvl = special==='phoenix' ? 25 : 20;
    wave = [{ species:special, level:lvl }];
  } else {
    const size = wildGroupSize();
    const lvl = wildLevel();
    let choices = REGION1_WILD.slice();
    if(ui.fledFrom){ const f=choices.filter(s=>s!==ui.fledFrom); if(f.length) choices=f; ui.fledFrom=null; }
    wave = [];
    for(let i=0;i<size;i++){ wave.push({ species: choices[Math.floor(Math.random()*choices.length)], level:lvl }); }
  }
  beginBattle({ waves:[wave], isNpc:false, allowCatch:true, name:'Wild encounter', silentIntro: !!encOpts.silentIntro });
}

/* ---------- shared multi-wave battle engine ---------- */
function beginBattle(config){
  ui.battle = {
    waves: config.waves, waveIndex:0,
    isNpc: !!config.isNpc, allowCatch: !!config.allowCatch,
    challenge: config.challenge || null, name: config.name || 'Battle',
    onWin: config.onWin || null, noFlee: !!config.noFlee, npcId: config.npcId || null, silentIntro: !!config.silentIntro,
    switchedThisTurn:false, busy:false, fightMistakes:[], phase:'player', wordCarry:0,
    playerStatuses:{},       // uid -> [ {type,...} ]   persists through switches/faints, cleared at battle end
    mirageActive:false,      // party-wide evasion buff
    usedVeryHigh:{}, usedUltra:{},   // uid -> true, once-per-battle usage
  };
  loadWave(0);
  playBattleMusic(!!config.isNpc, { silentIntro: !!config.silentIntro });
  go('battle');
}
function loadWave(i){
  const b = ui.battle;
  b.enemies = b.waves[i].map(spec => makeEnemy(spec.species, spec.level, { nerfed:spec.nerfed, ai:spec.ai }));
  b.enemies.forEach(e=>{ if(!state.encounteredSpecies.includes(e.species)) state.encounteredSpecies.push(e.species); });
  let ai = state.party.findIndex(m=>m.currentHp>0);
  if(ai<0) ai=0;
  b.activeIndex = ai; b.switchedThisTurn=false; b.phase='player';
  saveProfile();
}
function onWaveCleared(){
  const b = ui.battle;
  if(b.arena){
    // infinite waves: respawn fresh dummies, keep statuses and HP as-is
    b.enemies = Array.from({length:b.arenaCount}, ()=>makeDummy(b.arenaType));
    b.switchedThisTurn=false;
    b.phase='player';
    renderBattle();
    battleMsg('Dummies respawned. Keep testing!');
    return;
  }
  if(b.waveIndex < b.waves.length-1){
    b.waveIndex++;
    loadWave(b.waveIndex);
    renderBattle();
    battleMsg(`Wave ${b.waveIndex+1} of ${b.waves.length}!`);
  } else {
    if(b.isNpc) onChallengeWon();
    else onBattleWon();
  }
}

function activeMon(){ return state.party[ui.battle.activeIndex]; }
function monMaxHp(m){ return computeMaxStat(m.species, m.level, m.supplements); }
function monAtk(m){ return computeMaxStat(m.species, m.level, m.supplements); }
function unlockedMoves(m){
  const base = MOVES[m.species].map(mv=>{
    const [slot,name,mult,target,words,unlock]=mv;
    return { slot,name,mult,target,words,unlock, available:(name!=null && m.level>=unlock), isStone:false };
  });
  /* Equipped stone slots in by tier: High-tier "twin" skills override POWER1
     (they're a step above a basic swing), everything else overrides Basic. */
  if(m.equippedStone){
    const t = stoneTierDef(m.equippedStone.tier);
    const slot = (t.id==='high') ? 'Power1' : 'Basic';
    const bi = base.findIndex(mv=>mv.slot===slot);
    const used = t.id==='veryhigh' && ui.battle && ui.battle.usedVeryHigh[m.uid];
    if(bi>=0) base[bi] = { slot, name:m.equippedStone.name, mult:t.mult,
      target: t.kind==='multi2'?'Multi2':(t.kind==='status'?'Status':'Single'),
      words:t.words, unlock:0, available:!used, isStone:true, stoneTier:t.id, stoneType:m.equippedStone.type };
  }
  // Ultra stone adds a distinct 5th button
  if(m.ultraStone){
    const t = stoneTierDef('ultra');
    const used = ui.battle && ui.battle.usedUltra[m.uid];
    base.push({ slot:'UltraStone', name:m.ultraStone.name, mult:t.mult, target:'MultiHit', words:t.words,
      unlock:0, available:!used, isStone:true, stoneTier:'ultra', stoneType:m.ultraStone.type });
  }
  return base;
}

function hpBar2(id, cur, max, big){
  const pct = Math.max(0, cur/max*100);
  const h = big?12:7;
  return `<div class="hpbar2" id="${id}" style="height:${h}px;">
    <div class="hp-red" style="width:${pct}%;"></div>
    <div class="hp-green" style="width:${pct}%;background:${pct<30?'var(--cinnabar)':'var(--jade)'};"></div>
  </div>
  <div class="hp-num" id="${id}-num" style="font-size:${big?11:10}px;">${Math.max(0,cur)}/${max}</div>`;
}
/* Battle sprites scale with the viewport so the stage doesn't feel empty on a
   big screen, and shrink when several enemies share the row. */
function battleWidth(){
  const el = $('#app');
  const w = el ? el.getBoundingClientRect().width : Math.min(window.innerWidth, 480);
  return Math.max(320, w - 32);
}
function playerSpriteSize(){
  const byW = battleWidth() * 0.42;
  const byH = window.innerHeight * 0.22;
  return Math.round(Math.max(120, Math.min(byW, byH, 230)));
}
function enemySpriteSize(count){
  const n = Math.max(1, count||1);
  const per = (battleWidth() - (n-1)*10) / n;      // share of the row per enemy
  const byH = window.innerHeight * 0.17;
  return Math.round(Math.max(76, Math.min(per*0.78, byH, 170)));
}

function renderBattle(){
  setScreenBg('battle');
  const b = ui.battle;
  $('#brandSub').textContent = 'Battle';
  const mon = activeMon();
  const moves = unlockedMoves(mon);
  // Turn-lock: buttons are only truly interactive once it's genuinely the
  // player's turn again — not just while their own move's animation plays,
  // and not during the enemy's turn. Fixes a bug where a second move could be
  // clicked mid-animation and its quiz silently got wiped on the next redraw.
  const canAct = (b.phase || 'player') === 'player';
  screenEl.innerHTML = `
    <div class="battle-stage" id="battleStage">
      <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

      ${b.npcId ? `<div class="npc-banner">${npcPortrait(b.npcId, '🧑', 44, 'var(--paper-3)')}<span>${escapeHtml(b.name)}</span></div>` : ''}
      <div class="enemy-row">
        ${b.enemies.map((e,i)=>`
          <div class="enemy-card ${e.hp<=0?'fainted':''}" data-enemy="${i}" id="enemy-${i}" style="width:${enemySpriteSize(b.enemies.length)+16}px;">
            <div class="enemy-status" id="enemyStatus-${i}"></div>
            <div class="bob avatar-layer" id="enemyBob-${i}">${monPortrait(e.species,enemySpriteSize(b.enemies.length),{view:'front',bare:true,stage:e.stage||0,breathe: e.hp>0 ? ((e.hp/e.maxHp)<0.3 ? 'weak':'normal') : null})}</div>
            <div class="info-layer name-plate">
              <div class="mon-title">${SPECIES[e.species].name} <span>Lv ${e.level}</span></div>
              ${hpBar2('enemyHp-'+i, e.hp, e.maxHp, false)}
            </div>
          </div>`).join('')}
      </div>

      <div class="battlefield" aria-hidden="true"></div>

      <div class="player-card">
        <div class="bob player-avatar" id="playerBob">${monPortrait(mon.species,playerSpriteSize(),{view:'back',bare:true,stage:monStage(mon),breathe: mon.currentHp>0 ? ((mon.currentHp/monMaxHp(mon))<0.3 ? 'weak':'normal') : null})}</div>
        <div class="info-layer name-plate player-plate">

/* ---------- EFFECT LAYER ----------
   #fxLayer spans the whole rectangle containing the enemy row AND the player
   card. It sits above the monster avatars but below HP bars / names / text, so
   move animations can play across the full battle area.
   playEffect() is the hook for future art: if no asset is registered for the
   move it degrades to a short text flash + delay (per the design rule). */
/* ============================================================
   MOVE EFFECT ANIMATIONS
   ------------------------------------------------------------
   Two authoring formats are supported:

   1. SPRITE SHEET (preferred) — a horizontal strip of equal square frames in
      one PNG. Played with a CSS steps() animation, so the game controls
      exactly when it starts, how long it runs, and that it plays ONCE.
      Full alpha transparency, small files, frame-accurate.

   2. GIF (convenient) — simpler to produce, but the browser starts it on load
      and loops it forever, so we re-inject it each time to restart it and hide
      it after a set duration. Limited to 256 colours with hard-edged
      transparency (no soft glows).

   Effects resolve most-specific-first, so a handful of files covers everything:
      moveName ("Fusion Flare")  →  type_tier ("Fire_ultra")  →  type ("Fire")
   Author the nine type effects and every move is covered; add tier- or
   move-specific files later without touching code.
   ============================================================ */
/* ---------- SCREEN BACKGROUNDS ----------
   A faded image sits behind each major screen. Drop a file into assets/bg/ and
   it appears automatically; missing files simply leave the plain paper
   background. Opacity is deliberately low so text stays readable. */
const BG_DIR = 'assets/bg/';
const BG_MAP = {
  home:      'home.png',
  region:    'region.png',
  battle:    'battle.png',
  recover:   'recover.png',
  challenge: 'challenge.png',
  explore:   'explore.png',
  shop:      'shop.png',
};
const bgMissing = {};
function setScreenBg(key){
  const el = document.getElementById('screenBg');
  if(!el) return;
  const file = BG_MAP[key];
  if(!file || bgMissing[file]){ el.style.backgroundImage=''; el.classList.remove('on'); document.body.classList.remove('has-bg'); return; }
  const src = BG_DIR + file;
  const probe = new Image();
  probe.onload = ()=>{ el.style.backgroundImage = 'url('+src+')'; el.classList.add('on'); document.body.classList.add('has-bg'); };
  probe.onerror = ()=>{ bgMissing[file] = true; el.style.backgroundImage=''; el.classList.remove('on'); document.body.classList.remove('has-bg'); };
  probe.src = src;
}

const FX_DIR = 'assets/fx/';
const FX_FRAMES = 8;      // authoring standard: 8-frame horizontal strip
const FX_FPS    = 16;     // → 500ms per effect

/* Anything listed here is looked for on disk. Entries may override frames/fps,
   or point at a .gif instead. Missing files degrade to the text flash. */
const FX_MAP = {
  Fire:{file:'fire.png'},      Water:{file:'water.png'},   Grass:{file:'grass.png'},
  Electric:{file:'electric.png'}, Ground:{file:'ground.png'}, Flying:{file:'flying.png'},
  Physical:{file:'physical.png'}, Ghost:{file:'ghost.png'},  Psychic:{file:'psychic.png'},
};
const fxMissing = {};

function resolveFx(moveName, type, tier){
  const explicit = (typeof ASSETS!=='undefined' && ASSETS.effects) ? ASSETS.effects[moveName] : null;
  if(explicit) return { file:explicit, frames:FX_FRAMES, fps:FX_FPS };
  const keys = [moveName, (type&&tier)?type+'_'+tier:null, type];
  for(const k of keys){
    if(k && FX_MAP[k]) return Object.assign({ frames:FX_FRAMES, fps:FX_FPS }, FX_MAP[k]);
  }
  return null;
}

/* Position the effect over a specific combatant when asked, else centre it. */
function fxBox(at){
  const stage = $('#battleStage');
  if(!stage || !at) return null;
  const el = document.getElementById(at);
  if(!el) return null;
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  const size = Math.max(r.width, r.height) * 1.9;
  return {
    left: (r.left - s.left) + r.width/2  - size/2,
    top:  (r.top  - s.top ) + r.height/2 - size/2,
    size,
  };
}

function playEffect(moveName, opts, done){
  opts = opts || {};
  const layer = $('#fxLayer');
  if(!layer){ if(done) done(); return; }
  const fx = resolveFx(moveName, opts.type, opts.tier);
  const box = fxBox(opts.at);

  const place = (node, ms)=>{
    if(box){
      node.style.position='absolute';
      node.style.left=box.left+'px'; node.style.top=box.top+'px';
      node.style.width=box.size+'px'; node.style.height=box.size+'px';
    }
    layer.appendChild(node);
    setTimeout(()=>{ if(node.parentNode) layer.removeChild(node); if(done) done(); }, ms);
  };

  if(fx && !fxMissing[fx.file]){
    const src = FX_DIR + fx.file;
    if(/\.gif$/i.test(fx.file)){
      // GIF: cache-bust so it restarts from frame 1 every time it's used
      const img = document.createElement('img');
      img.className='fx-sprite';
      img.onerror = ()=>{ fxMissing[fx.file]=true; };
      img.src = src + '?t=' + Date.now();
      place(img, opts.duration || 700);
      return;
    }
    // Sprite sheet: verify it loads, then run a steps() animation exactly once
    const probe = new Image();
    probe.onload = ()=>{
      const div = document.createElement('div');
      div.className = 'fx-sheet';
      const ms = Math.round(fx.frames / fx.fps * 1000);
      div.style.backgroundImage = 'url('+src+')';
      div.style.backgroundSize = (fx.frames*100)+'% 100%';
      div.style.animation = 'fxPlay '+ms+'ms steps('+fx.frames+') 1 both';
      place(div, opts.duration || ms + 60);
    };
    probe.onerror = ()=>{
      fxMissing[fx.file] = true;
      playEffect(moveName, Object.assign({}, opts, {_noAsset:true}), done);  // fall through to text
    };
    probe.src = src;
    return;
  }

  // no art available — the original text flash
  const tag = document.createElement('div');
  tag.className = 'fx-text';
  tag.textContent = moveName;
  place(tag, opts.duration || 450);
}

function battleMsg(t){ const el=$('#battleMsg'); if(el) el.textContent=t; }

/* ---------- BATTLE LOG (arena debugging) ---------- */
function logBattle(msg){
  if(!ui.battle) return;
  if(!ui.battle.log) ui.battle.log = [];
  ui.battle.log.push(msg);
  if(ui.battle.log.length>200) ui.battle.log.shift();
  const box = $('#logBody');
  if(box){
    const d = document.createElement('div');
    d.style.cssText='padding:3px 0;border-bottom:1px solid rgba(35,32,25,0.07);';
    d.textContent = msg;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }
}

function bob(el, dir){ // dir: +1 = right, -1 = left
  if(!el) return;
  el.style.transition='transform .16s ease-out';
  el.style.transform=`translateX(${dir*14}px)`;
  setTimeout(()=>{ el.style.transform='translateX(0)'; }, 170);
}
function flashHit(el){
  if(!el) return;
  el.classList.remove('hit-flash'); void el.offsetWidth; el.classList.add('hit-flash');
}
function drainHp(id, oldCur, newCur, max){
  const bar = document.getElementById(id);
  const num = document.getElementById(id+'-num');
  if(!bar) return;
  const green = bar.querySelector('.hp-green');
  const red = bar.querySelector('.hp-red');
  const oldPct = Math.max(0, oldCur/max*100);
  const newPct = Math.max(0, newCur/max*100);
  if(red){ red.style.transition='none'; red.style.width=oldPct+'%'; }
  if(green){ green.style.transition='width .1s'; green.style.width=newPct+'%'; green.style.background = newPct<30?'var(--cinnabar)':'var(--jade)'; }
  if(num) num.textContent = Math.max(0,newCur)+'/'+max;
  // let the red band linger, then shrink it away
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
    if(red){ red.style.transition='width .8s ease-out'; red.style.width=newPct+'%'; }
  });});
}

function onSwitchPressed(){

  if(b.switchedThisTurn) return;
